<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Application Form | GlobalWork</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:#e6e6e6;color:var(--text-dark);min-height:100vh;line-height:1.5}
a{text-decoration:none;color:inherit}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1}
.container{width:100%;max-width:1000px;margin:0 auto;padding:0 20px}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}

/* Form Container */
.form-wrapper{padding:40px 20px; display: flex; justify-content: center;}
.form-container{background:#e8e8e8; width:100%; max-width:800px; padding:40px; border-radius:8px; box-shadow:var(--sh-md); position: relative;}

/* Country Logo */
.canada-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    position: absolute;
    top: 20px;
    left: 30px;
}
.canada-logo img {
    height: 35px;
}
.canada-logo-text {
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    color: #333;
    line-height: 1.1;
}

.form-container h1{font-size:28px; margin-top: 30px; margin-bottom:10px; color:#222;}
.form-container p.subtitle{color:#555; margin-bottom:30px; font-size:15px;}

/* Form Rows */
.form-row{display:flex; gap:20px; margin-bottom:25px; align-items:flex-start;}
.form-row label{width:150px; font-weight:600; font-size:14px; padding-top:10px; color:#222;}
.form-row label span{color:#c8102e;}
.input-group{flex:1; display:flex; flex-direction:column; gap:10px;}
.name-inputs{display:flex; gap:10px;}
.name-inputs input{width:33.33%;}
input[type="text"], input[type="email"], select {padding:12px; border:1px solid #ccc; border-radius:4px; background:#fff; font-family:inherit; font-size:14px; outline:none; width:100%;}
input:focus, select:focus{border-color:var(--primary);}
.city-state-row{display:flex; gap:10px;}
.birthdate-inputs{display:flex; gap:10px;}
.birthdate-inputs select{width:33.33%; color:#777;}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; padding:10px 24px; border:none; border-radius:4px; cursor:pointer; transition:all .2s;}
.btn-back{background:#444; color:#fff;}
.btn-back:hover{background:#222;}
.btn-next{background:#e8e8e8; color:#333; border:1px solid #999;}
.btn-next:hover{background:#ddd;}
.form-actions{display:flex; justify-content:space-between; margin-top:40px; align-items:center;}

/* Lang Select */
#langSel {padding:8px 12px;border:1px solid var(--border);border-radius:40px;font:inherit;font-size:14px;background:var(--light-bg);cursor:pointer}

@media(max-width:640px){
  .form-row{flex-direction:column; gap:10px;}
  .form-row label{padding-top:0;}
  .name-inputs{flex-direction:column;}
  .name-inputs input{width:100%;}
  .city-state-row{flex-direction:column;}
  .birthdate-inputs{flex-direction:column;}
  .birthdate-inputs select{width:100%;}
  .canada-logo { position: static; margin-bottom: 20px; }
  .form-container h1{ margin-top: 10px; }
}
</style>
</head>

  let LANG = 'en';
  try { LANG = localStorage.getItem('globalwork_lang') || 'en'; } catch(e) {}
  if(!T[LANG]) LANG = 'en';

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T[LANG][key]) el.innerHTML = T[LANG][key];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (T[LANG][key]) el.placeholder = T[LANG][key];
    });
    
    const monthSelect = document.getElementById('monthSelect');
    const currentVal = monthSelect.value;
    monthSelect.innerHTML = `<option value="">${T[LANG].selMonth}</option>`;
    T[LANG].months.forEach((m, i) => {
      monthSelect.innerHTML += `<option value="${i+1}">${m}</option>`;
    });
    monthSelect.value = currentVal;

    document.documentElement.lang = LANG;
    document.getElementById('langSel').value = LANG;
  }

  document.getElementById('langSel').addEventListener('change', function(e) {
    LANG = e.target.value;
    try { localStorage.setItem('globalwork_lang', LANG); } catch(x) {}
    applyI18n();
  });

  const urlParams = new URLSearchParams(window.location.search);
  const jobTitle = urlParams.get('job');
  
  if (jobTitle) {
    document.getElementById('jobTitleDisplay').textContent = jobTitle;
  } else {
    document.getElementById('jobTitleDisplay').textContent = "General Position";
  }

  const daySelect = document.getElementById('daySelect');
  const yearSelect = document.getElementById('yearSelect');

  for (let i = 1; i <= 31; i++) {
    let option = document.createElement('option');
    option.value = i;
    option.textContent = i;
    daySelect.appendChild(option);
  }

  for (let i = 2006; i >= 1950; i--) {
    let option = document.createElement('option');
    option.value = i;
    option.textContent = i;
    yearSelect.appendChild(option);
  }

  // ==========================================
  // ⚠️ ফর্ম সাবমিট ফাংশন
  // ==========================================
  function submitForm(event) {
    event.preventDefault(); // পেজ রিফ্রেশ হওয়া আটকায়
    
    const urlParams = new URLSearchParams(window.location.search);
    const job = urlParams.get('job');
    const country = urlParams.get('country'); // country প্যারামিটার নেওয়া হচ্ছে
    
    // পরবর্তী পেজে পাঠানোর সময় country প্যারামিটারটিও সাথে পাঠাতে হবে
    let nextUrl = 'apply-step2.html?job=' + encodeURIComponent(job || '');
    if (country) {
        nextUrl += '&country=' + encodeURIComponent(country);
    }
    
    window.location.href = nextUrl;
  }

  applyI18n();
</script>
