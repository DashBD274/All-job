<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Application Form | GlobalWork</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:#e6e6e6;color:var(--text-dark);min-height:100vh;line-height:1.5}
a{text-decoration:none;color:inherit}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1}
.container{width:100%;max-width:1000px;margin:0 auto;padding:0 20px}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}

/* Form Container */
.form-wrapper{padding:40px 20px; display: flex; justify-content: center;}
.form-container{background:#e8e8e8; width:100%; max-width:800px; padding:40px; border-radius:8px; box-shadow:var(--sh-md);}
.form-container h1{font-size:28px; margin-bottom:10px; color:#222;}
.form-container p.subtitle{color:#555; margin-bottom:30px; font-size:15px;}

/* Form Rows */
.form-row{display:flex; gap:20px; margin-bottom:25px; align-items:flex-start;}
.form-row label{width:150px; font-weight:600; font-size:14px; padding-top:10px; color:#222;}
.form-row label span{color:#c8102e;}
.input-group{flex:1; display:flex; flex-direction:column; gap:10px;}
.name-inputs{display:flex; gap:10px;}
.name-inputs input{width:33.33%;}
input[type="text"], input[type="email"], select {padding:12px; border:1px solid #ccc; border-radius:4px; background:#fff; font-family:inherit; font-size:14px; outline:none; width:100%;}
input:focus, select:focus{border-color:var(--primary);}
.city-state-row{display:flex; gap:10px;}
.birthdate-inputs{display:flex; gap:10px;}
.birthdate-inputs select{width:33.33%; color:#777;}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; padding:10px 24px; border:none; border-radius:4px; cursor:pointer; transition:all .2s;}
.btn-back{background:#444; color:#fff;}
.btn-back:hover{background:#222;}
.btn-next{background:#e8e8e8; color:#333; border:1px solid #999;}
.btn-next:hover{background:#ddd;}
.form-actions{display:flex; justify-content:space-between; margin-top:40px; align-items:center;}

@media(max-width:640px){
  .form-row{flex-direction:column; gap:10px;}
  .form-row label{padding-top:0;}
  .name-inputs{flex-direction:column;}
  .name-inputs input{width:100%;}
  .city-state-row{flex-direction:column;}
  .birthdate-inputs{flex-direction:column;}
  .birthdate-inputs select{width:100%;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="canada-apply.html" class="logo"><i class="fas fa-briefcase"></i><span>GlobalWork</span></a>
  </div>
</header>

<div class="form-wrapper">
  <div class="form-container">
    <h1>Job Application</h1>
    <p class="subtitle">Please complete the form below to apply for the position of <strong id="jobTitleDisplay">Job Position</strong> with us.</p>
    
    <form action="#" method="POST" onsubmit="submitForm(event)">
      
      <!-- Full Name -->
      <div class="form-row">
        <label>Full Name <span>*</span></label>
        <div class="input-group">
          <div class="name-inputs">
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Middle Name">
            <input type="text" placeholder="Last Name" required>
          </div>
        </div>
      </div>

      <!-- Current Address -->
      <div class="form-row">
        <label>Current Address</label>
        <div class="input-group">
          <input type="text" placeholder="Street Address">
          <input type="text" placeholder="Street Address Line 2">
          <div class="city-state-row">
            <input type="text" placeholder="City">
            <input type="text" placeholder="State / Province">
          </div>
          <div class="city-state-row">
            <input type="text" placeholder="Postal / Zip Code">
            <select>
              <option value="">Please Select Country</option>
              <option value="Canada">Canada</option>
              <option value="Bangladesh">Bangladesh</option>
              <option value="USA">United States</option>
              <option value="UK">United Kingdom</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div class="form-row">
        <label>Email Address <span>*</span></label>
        <div class="input-group">
          <input type="email" placeholder="ex: myname@example.com" required>
        </div>
      </div>

      <!-- Phone -->
      <div class="form-row">
        <label>Phone Number <span>*</span></label>
        <div class="input-group" style="flex-direction:row;">
          <input type="text" placeholder="Area Code" style="width: 30%;" required>
          <input type="text" placeholder="Phone Number" style="flex:1;" required>
        </div>
      </div>

      <!-- Birth Date -->
      <div class="form-row">
        <label>Birth Date <span>*</span></label>
        <div class="input-group">
          <div class="birthdate-inputs">
            <select required>
              <option value="">Please select a month</option>
              <option>January</option><option>February</option><option>March</option>
              <option>April</option><option>May</option><option>June</option>
              <option>July</option><option>August</option><option>September</option>
              <option>October</option><option>November</option><option>December</option>
            </select>
            <select required>
              <option value="">Please select a day</option>
              <!-- জাভাস্ক্রিপ্ট দিয়ে দিনগুলো বসানো হবে -->
            </select>
            <select required>
              <option value="">Please select a year</option>
              <!-- জাভাস্ক্রিপ্ট দিয়ে বছরগুলো বসানো হবে -->
            </select>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" class="btn btn-back" onclick="window.location.href='canada-apply.html'">Back to Jobs</button>
        <button type="submit" class="btn btn-next">Next</button>
      </div>

    </form>
  </div>
</div>

<script>
  // ১. প্রথম পেজ (canada-apply.html) থেকে চাকরির নাম নিয়ে আসা
  // URL থেকে '?job=JobTitle' অংশটি খুঁজে বের করবে
  const urlParams = new URLSearchParams(window.location.search);
  const jobTitle = urlParams.get('job');
  
  if (jobTitle) {
    document.getElementById('jobTitleDisplay').textContent = jobTitle;
  } else {
    document.getElementById('jobTitleDisplay').textContent = "General Position";
  }

  // ২. জন্ম তারিখের ড্রপডাউনে দিন ও বছর যোগ করা
  const daySelect = document.querySelectorAll('.birthdate-inputs select')[1];
  const yearSelect = document.querySelectorAll('.birthdate-inputs select')[2];

  // দিন (১-৩১)
  for (let i = 1; i <= 31; i++) {
    let option = document.createElement('option');
    option.value = i;
    option.textContent = i;
    daySelect.appendChild(option);
  }

  // বছর (১৯৫০-২০০৬)
  for (let i = 2006; i >= 1950; i--) {
    let option = document.createElement('option');
    option.value = i;
    option.textContent = i;
    yearSelect.appendChild(option);
  }

  // ৩. ফর্ম সাবমিট করার ফাংশন
  function submitForm(event) {
    event.preventDefault(); // পেজ রিফ্রেশ হওয়া আটকায়
    alert("Your application for '" + document.getElementById('jobTitleDisplay').textContent + "' has been submitted successfully!");
    // এখানে আপনি চাইলে AJAX/Fetch দিয়ে ডেটাবেসে ডেটা পাঠাতে পারেন
  }
</script>
</body>
</html>
