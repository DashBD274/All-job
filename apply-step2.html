<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Interest | GlobalWork</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:#e6e6e6;color:var(--text-dark);min-height:100vh;line-height:1.5}
a{text-decoration:none;color:inherit}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1}
.container{width:100%;max-width:1000px;margin:0 auto;padding:0 20px}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}

/* Form Container */
.form-wrapper{padding:40px 20px; display: flex; justify-content: center;}
.form-container{background:#e8e8e8; width:100%; max-width:800px; padding:40px; border-radius:8px; box-shadow:var(--sh-md);}
.form-container h1{font-size:28px; margin-bottom:30px; color:#222; border-bottom:1px solid #ccc; padding-bottom:10px;}

/* Form Rows */
.form-row{display:flex; gap:20px; margin-bottom:25px; align-items:flex-start;}
.form-row label{width:250px; font-weight:600; font-size:14px; padding-top:5px; color:#222; line-height: 1.4;}
.form-row label span{color:#c8102e;}
.input-group{flex:1; display:flex; flex-direction:column; gap:10px;}

input[type="text"], select, textarea {padding:10px; border:1px solid #ccc; border-radius:4px; background:#fff; font-family:inherit; font-size:14px; outline:none; width:100%;}
input:focus, select:focus, textarea:focus{border-color:var(--primary);}
textarea{resize:vertical; min-height: 80px;}

/* Radio & Checkbox Groups */
.checkbox-group, .radio-group {display:flex; flex-direction:column; gap:8px;}
.checkbox-item, .radio-item {display:flex; align-items:center; gap:8px; font-size:14px;}
input[type="checkbox"], input[type="radio"] {width:16px; height:16px; cursor:pointer;}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; padding:10px 24px; border:none; border-radius:4px; cursor:pointer; transition:all .2s;}
.btn-back{background:#e8e8e8; color:#333; border:1px solid #999;}
.btn-back:hover{background:#ddd;}
.btn-next{background:#e8e8e8; color:#333; border:1px solid #999;}
.btn-next:hover{background:#ddd;}
.form-actions{display:flex; justify-content:space-between; margin-top:40px; align-items:center; border-top: 1px solid #ccc; padding-top: 20px;}

/* Lang Select */
#langSel {padding:8px 12px;border:1px solid var(--border);border-radius:40px;font:inherit;font-size:14px;background:var(--light-bg);cursor:pointer}

@media(max-width:640px){
  .form-row{flex-direction:column; gap:10px;}
  .form-row label{width:100%; padding-top:0;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="canada-apply.html" class="logo"><i class="fas fa-briefcase"></i><span>GlobalWork</span></a>
    
    <select id="langSel">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="hi">हिन्दी</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</header>

<div class="form-wrapper">
  <div class="form-container">
    <h1 data-i18n="step2Title">Job Interest</h1>
    
    <form action="#" method="POST" onsubmit="submitStep2(event)">
      
      <!-- Applying for Position -->
      <div class="form-row">
        <label data-i18n="applyingPos">Applying for Position <span>*</span></label>
        <div class="input-group">
          <select id="posSelect" required>
            <option value="" data-i18n="pleaseSelect">Please Select</option>
            <!-- এই অপশনগুলো জাভাস্ক্রিপ্ট দিয়ে অটোমেটিক বসবে -->
          </select>
        </div>
      </div>

      <!-- Type of Employment -->
      <div class="form-row">
        <label data-i18n="empType">Type of employment desired <span>*</span></label>
        <div class="input-group checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="empType" value="Full-Time"> <span data-i18n="fullTime">Full-Time</span></label>
          <label class="checkbox-item"><input type="checkbox" name="empType" value="Part-Time"> <span data-i18n="partTime">Part-Time</span></label>
          <label class="checkbox-item"><input type="checkbox" name="empType" value="Temporary"> <span data-i18n="temporary">Temporary</span></label>
        </div>
      </div>

      <!-- Sales/CS Experience -->
      <div class="form-row">
        <label data-i18n="salesExp">Describe your sales or customer service experience</label>
        <div class="input-group">
          <textarea placeholder=""></textarea>
        </div>
      </div>

      <!-- Why Should Hire -->
      <div class="form-row">
        <label data-i18n="whyHire">You should hire me for your team because:</label>
        <div class="input-group">
          <textarea placeholder=""></textarea>
        </div>
      </div>

      <!-- Eligible to work in US -->
      <div class="form-row">
        <label data-i18n="usEligible">If hired, can you furnish proof you are eligible to work in the U.S.? <span>*</span></label>
        <div class="input-group radio-group">
          <label class="radio-item"><input type="radio" name="usEligible" value="Yes" required> <span data-i18n="yes">YES</span></label>
          <label class="radio-item"><input type="radio" name="usEligible" value="No"> <span data-i18n="no">NO</span></label>
        </div>
      </div>

      <!-- Active Checking Account -->
      <div class="form-row">
        <label data-i18n="checkingAccount">Do You Have An Active Checking Account (For Payroll Direct Deposits)? <span>*</span></label>
        <div class="input-group radio-group">
          <label class="radio-item"><input type="radio" name="checkingAcc" value="Yes" required> <span data-i18n="yes">YES</span></label>
          <label class="radio-item"><input type="radio" name="checkingAcc" value="No"> <span data-i18n="no">NO</span></label>
        </div>
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="button" class="btn btn-back" data-i18n="backBtn" onclick="history.back()">Back</button>
        <button type="submit" class="btn btn-next" data-i18n="nextBtn">Next</button>
      </div>

    </form>
  </div>
</div>

<script>

      salesExp:"আপনার বিক্রয় বা গ্রাহক সেবার অভিজ্ঞতা বর্ণনা করুন", whyHire:"আপনি আমাকে আপনার দলে নিয়োগ করবেন কারণ:",

    },

      step2Title:"Interés Laboral", applyingPos:"Aplicando para el Puesto", pleaseSelect:"Por favor Seleccione", 
      empType:"Tipo de empleo deseado", fullTime:"Tiempo Completo", partTime:"Medio Tiempo", temporary:"Temporal",
      salesExp:"Describa su experiencia en ventas o servicio al cliente", whyHire:"Debería contratarme para su equipo porque:",
      usEligible:"Si es contratado, ¿puede proporcionar prueba de que es elegible para trabajar en los EE. UU.?",

      jobs:["Trabajador Agrícola", "Trabajador de Procesamiento de Alimentos", "Conductor de Camión", "Asociado de Almacén", "Especialista en Soporte de TI", "Ama de Llaves de Hotel", "Trabajador General"]
    },
    fr: { 
      step2Title:"Intérêt pour l'Emploi", applyingPos:"Postuler pour le Poste", pleaseSelect:"Veuillez Sélectionner", 
      empType:"Type d'emploi souhaité", fullTime:"Temps Plein", partTime:"Temps Partiel", temporary:"Temporaire",
      salesExp:"Décrivez votre expérience en ventes ou en service client", whyHire:"Vous devriez m'embaucher pour votre équipe car:",
      usEligible:"Si vous êtes embauché, pouvez-vous fournir la preuve que vous êtes éligible pour travailler aux États-Unis?", 
      checkingAccount:"Avez-vous un compte courant actif (pour les dépôts directs de paie)?",

    },
    de: { 
      step2Title:"Job-Interesse", applyingPos:"Bewerbung für Position", pleaseSelect:"Bitte Auswählen", 
      empType:"Gewünschte Beschäftigungsart", fullTime:"Vollzeit", partTime:"Teilzeit", temporary:"Befristet",
      salesExp:"Beschreiben Sie Ihre Vertriebs- oder Kundendiensterfahrung", whyHire:"Sie sollten mich für Ihr Team einstellen, weil:",
      usEligible:"Wenn Sie eingestellt werden, können Sie den Nachweis erbringen, dass Sie berechtigt sind, in den USA zu arbeiten?", 
      checkingAccount:"Haben Sie ein aktives Girokonto (für direkte Gehaltsüberweisungen)?",
      yes:"JA", no:"NEIN", backBtn:"Zurück", nextBtn:"Weiter",
      jobs:["Landarbeiter", "Lebensmittelverarbeiter", "LKW-Fahrer", "Lagerarbeiter", "IT-Support-Spezialist", "Hotelzimmermädchen", "Allgemeiner Arbeiter"]
    },
    pt: { 
      step2Title:"Interesse no Trabalho", applyingPos:"Candidatando-se para a Vaga", pleaseSelect:"Por favor Selecione", 
      empType:"Tipo de emprego desejado", fullTime:"Tempo Integral", partTime:"Meio Período", temporary:"Temporário",
      salesExp:"Descreva sua experiência em vendas ou atendimento ao cliente", whyHire:"Você deveria me contratar para sua equipe porque:",
      usEligible:"Se contratado, você pode fornecer prova de que é elegível para trabalhar nos EUA?", 
      checkingAccount:"Você tem uma conta corrente ativa (para depósitos diretos de pagamento)?",
      yes:"SIM", no:"NÃO", backBtn:"Voltar", nextBtn:"Próximo",
      jobs:["Trabalhador Rural", "Trabalhador de Processamento de Alimentos", "Motorista de Caminhão", "Associado de Armazém", "Especialista em Suporte de TI", "Camareira de Hotel", "Trabalhador Geral"]
    },
    hi: { 
      step2Title:"नौकरी में रुचि", applyingPos:"पद के लिए आवेदन", pleaseSelect:"कृपया चयन करें", 
      empType:"वांछित रोजगार का प्रकार", fullTime:"पूर्णकालिक", partTime:"अंशकालिक", temporary:"अस्थायी",
      salesExp:"अपने बिक्री या ग्राहक सेवा अनुभव का वर्णन करें", whyHire:"आपको मुझे अपनी टीम के लिए क्यों नियुक्त करना चाहिए:",
      usEligible:"यदि काम पर रखा जाता है, तो क्या आप प्रमाण दे सकते हैं कि आप अमेरिका में काम करने के पात्र हैं?", 
      checkingAccount:"क्या आपके पास एक सक्रिय चेकिंग खाता है (पेरोल प्रत्यक्ष जमा के लिए)?",
      yes:"हाँ", no:"नहीं", backBtn:"पीछे", nextBtn:"आगे",
      jobs:["खेत मजदूर", "खाद्य प्रसंस्करण कार्यकर्ता", "ट्रक चालक", "गोदाम सहयोगी", "आईटी सहायता विशेषज्ञ", "होटल हाउसकीपर", "सामान्य मजदूर"]
    },
    ar: { 
      step2Title:"الاهتمام بالوظيفة", applyingPos:"التقديم على الوظيفة", pleaseSelect:"الرجاء الاختيار", 
      empType:"نوع التوظيف المطلوب", fullTime:"دوام كامل", partTime:"دوام جزئي", temporary:"مؤقت",
      salesExp:"صف خبرتك في المبيعات أو خدمة العملاء", whyHire:"يجب عليك توظيفي في فريقك للأسباب التالية:",
      usEligible:"إذا تم توظيفك، هل يمكنك تقديم إثبات أنك مؤهل للعمل في الولايات المتحدة؟", 
      checkingAccount:"هل لديك حساب جاري نشط (للإيداع المباشر للرواتب)؟",
      yes:"نعم", no:"لا", backBtn:"رجوع", nextBtn:"التالي",
      jobs:["عامل مزرعة", "عامل معالجة أغذية", "سائق شاحنة", "مساعد مستودع", "أخصائي دعم فني", "عاملة نظافة فندق", "عامل عام"]
    },
    zh: { 
      step2Title:"工作意向", applyingPos:"申请职位", pleaseSelect:"请选择", 
      empType:"期望的就业类型", fullTime:"全职", partTime:"兼职", temporary:"临时",
      salesExp:"描述您的销售或客户服务经验", whyHire:"您应该聘用我加入您的团队，因为：",
      usEligible:"如果被录用，您能提供在美国工作资格的证明吗？", 
      checkingAccount:"您是否有活跃的支票账户（用于工资直接存款）？",
      yes:"是", no:"否", backBtn:"返回", nextBtn:"下一步",
      jobs:["农场工人", "食品加工工人", "卡车司机", "仓库助理", "IT支持专家", "酒店客房服务员", "普工"]
    },
    ja: { 
      step2Title:"職務への関心", applyingPos:"応募職種", pleaseSelect:"選択してください", 
      empType:"希望する雇用形態", fullTime:"正社員", partTime:"パートタイム", temporary:"臨時",
      salesExp:"営業またはカスタマーサービスの経験を説明してください", whyHire:"私をチームに採用すべき理由：",
      usEligible:"採用された場合、米国で働く資格の証明を提出できますか？", 
      checkingAccount:"給与の直接預金用の当座預金口座をお持ちですか？",
      yes:"はい", no:"いいえ", backBtn:"戻る", nextBtn:"次へ",
      jobs:["農場労働者", "食品加工労働者", "トラック運転手", "倉庫作業員", "ITサポートスペシャリスト", "ホテルの客室係", "一般労働者"]
    }
  };

  let LANG = 'en';
  try { LANG = localStorage.getItem('globalwork_lang') || 'en'; } catch(e) {}
  if(!T[LANG]) LANG = 'en';

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T[LANG][key]) el.innerHTML = T[LANG][key];
    });
    
    // Populate Position Dropdown
    const posSelect = document.getElementById('posSelect');
    const currentPos = posSelect.value;
    posSelect.innerHTML = `<option value="">${T[LANG].pleaseSelect}</option>`;
    T[LANG].jobs.forEach(job => {
      posSelect.innerHTML += `<option value="${job}">${job}</option>`;
    });
    
    // URL থেকে আসা জব টাইটেল সিলেক্ট করা (যদি থাকে)
    const urlParams = new URLSearchParams(window.location.search);
    const jobTitleParam = urlParams.get('job');
    if(jobTitleParam) {
      // যদি URL-এ থাকা জবটি ড্রপডাউনে থাকে, তবে সেটি সিলেক্ট হয়ে থাকবে
      for(let i=0; i<posSelect.options.length; i++){
        if(posSelect.options[i].text.toLowerCase().includes(jobTitleParam.toLowerCase()) || jobTitleParam.toLowerCase().includes(posSelect.options[i].text.toLowerCase())){
            posSelect.selectedIndex = i;
            break;
        }
      }
    } else {
      posSelect.value = currentPos;
    }

    document.documentElement.lang = LANG;
    document.getElementById('langSel').value = LANG;
  }

  document.getElementById('langSel').addEventListener('change', function(e) {
    LANG = e.target.value;
    try { localStorage.setItem('globalwork_lang', LANG); } catch(x) {}
    applyI18n();
  });

  function submitStep2(event) {
    event.preventDefault();
    // এখানে আপনি সাবমিট করার পরের লজিক দিতে পারেন (যেমন: ধন্যবাদ পেজে পাঠানো)
    alert("Step 2 submitted successfully!");
  }

  // Initial Setup
  applyI18n();
</script>
</body>
</html>
