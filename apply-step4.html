<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Method | GlobalWork</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:#e6e6e6;color:var(--text-dark);min-height:100vh;line-height:1.5; display: flex; flex-direction: column;}
a{text-decoration:none;color:inherit}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1; width: 100%;}
.container{width:100%;max-width:1000px;margin:0 auto;padding:0 20px}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}

/* Form Container */
.form-wrapper{padding:40px 20px; display: flex; justify-content: center; flex: 1;}
.form-container{background:#e8e8e8; width:100%; max-width:800px; padding:40px; border-radius:8px; box-shadow:var(--sh-md);}
.form-container h1{font-size:24px; margin-bottom:20px; color:#222; border-bottom:1px solid #ccc; padding-bottom:10px; display: flex; justify-content: space-between; align-items: center;}

/* Payment Grid */
.payment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
.pay-btn { background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 6px; text-align: center; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;}
.pay-btn:hover { border-color: var(--primary); background: #f8f9fa; }
.pay-btn.active { border-color: var(--primary); background: #eaf1fb; box-shadow: 0 0 0 2px rgba(18,53,91,0.2); }
.pay-btn i { font-size: 24px; color: var(--primary); }

/* Discount Badge */
.discount-badge { background: #16a34a; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 12px; margin-left: 5px; vertical-align: middle; }

/* Form Fields */
.form-group { margin-bottom: 20px; display: none; }
.form-group.show { display: block; }
.form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #222; }
.form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 14px; outline: none; }
.form-group input:focus, .form-group select:focus { border-color: var(--primary); }

/* Buttons */
.form-actions{display:flex; justify-content:flex-end; gap: 15px; margin-top:30px; border-top: 1px solid #ccc; padding-top: 20px;}
.btn{display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; padding:10px 30px; border:none; border-radius:4px; cursor:pointer; transition:all .2s;}
.btn-cancel{background:#e8e8e8; color:#333; border:1px solid #999;}
.btn-cancel:hover{background:#ddd;}
.btn-create{background:#4f46e5; color:#fff; border:none;}
.btn-create:hover{background:#4338ca;}

/* Toast */
.toast{position:fixed; right:20px; bottom:20px; background:var(--primary); color:#fff; padding:12px 18px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:300; animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

#langSel {padding:8px 12px;border:1px solid var(--border);border-radius:40px;font:inherit;font-size:14px;background:var(--light-bg);cursor:pointer}

@media(max-width:640px){
  .payment-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="canada-apply.html" class="logo"><i class="fas fa-briefcase"></i><span>GlobalWork</span></a>
    
    <select id="langSel">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
    </select>
  </div>
</header>

<div class="form-wrapper">
  <div class="form-container">
    <h1>
      <span data-i18n="title">Add a payment method</span>
      <button type="button" style="background:none; border:none; font-size:24px; cursor:pointer; color:#666;" onclick="window.location.href='canada-apply.html'">&times;</button>
    </h1>
    
    <!-- Payment Options Grid -->
    <div class="payment-grid">
      <!-- Bangladesh Local Methods -->
      <button type="button" class="pay-btn active" onclick="selectPayment('bkash', this)"><i>📱</i> <span>bKash</span></button>
      <button type="button" class="pay-btn" onclick="selectPayment('nagad', this)"><i>📱</i> <span>Nagad</span></button>
      <button type="button" class="pay-btn" onclick="selectPayment('rocket', this)"><i>📱</i> <span>Rocket</span></button>
      <button type="button" class="pay-btn" onclick="selectPayment('bank', this)"><i>🏦</i> <span data-i18n="bank">Bank Transfer</span></button>
      
      <!-- Crypto Method with Discount -->
      <button type="button" class="pay-btn" onclick="selectPayment('crypto', this)" style="grid-column: span 2;">
        <i>💎</i> 
        <span><span data-i18n="crypto">Crypto Payment</span> <span class="discount-badge">10% OFF</span></span>
      </button>

      <!-- Coming Soon Methods -->
      <button type="button" class="pay-btn" onclick="showComingSoon('Card')"><i>💳</i> <span>Card</span></button>
      <button type="button" class="pay-btn" onclick="showComingSoon('PayPal')"><i>🅿️</i> <span>PayPal</span></button>
      <button type="button" class="pay-btn" onclick="showComingSoon('Apple Pay')"><i>🍎</i> <span>Apple Pay</span></button>
    </div>

    <form action="#" method="POST" onsubmit="processPayment(event)">
      
      <!-- bKash Form -->
      <div id="form-bkash" class="form-group show">
        <label data-i18n="bkashLabel">bKash Account Number</label>
        <input type="text" placeholder="e.g. 017XXXXXXXX" required>
      </div>

      <!-- Nagad Form -->
      <div id="form-nagad" class="form-group">
        <label data-i18n="nagadLabel">Nagad Account Number</label>
        <input type="text" placeholder="e.g. 017XXXXXXXX">
      </div>

      <!-- Rocket Form -->
      <div id="form-rocket" class="form-group">
        <label data-i18n="rocketLabel">Rocket Account Number</label>
        <input type="text" placeholder="e.g. 017XXXXXXXX-1">
      </div>

      <!-- Bank Form -->
      <div id="form-bank" class="form-group">
        <label data-i18n="bankLabel">Bank Name</label>
        <select>
          <option value="">Select Bank</option>
          <option value="DBBL">Dutch-Bangla Bank</option>
          <option value="BRAC">BRAC Bank</option>
          <option value="City">City Bank</option>
          <option value="Other">Other Bank</option>
        </select>
        <label style="margin-top:15px;" data-i18n="accNo">Account Number</label>
        <input type="text" placeholder="Enter Bank Account Number">
      </div>

      <!-- Crypto Form -->
      <div id="form-crypto" class="form-group">
        <div style="background:#fff; border:1px solid #16a34a; padding:15px; border-radius:6px; margin-bottom:15px; color:#16a34a; font-weight:600; font-size:14px;">
          <span data-i18n="cryptoMsg">You will get a 10% discount on the total application fee by paying with cryptocurrency.</span>
        </div>
        <label data-i18n="cryptoSelect">Select Cryptocurrency</label>
        <select>
          <option value="USDT">USDT (Tether)</option>
          <option value="BTC">Bitcoin (BTC)</option>
          <option value="ETH">Ethereum (ETH)</option>
        </select>
        <label style="margin-top:15px;" data-i18n="wallet">Your Wallet Address</label>
        <input type="text" placeholder="Enter your crypto wallet address">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-i18n="cancelBtn" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn btn-create" data-i18n="payBtn">Pay Now</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Translations
  const T = {
    en: { 
      title:"Add a payment method", bank:"Bank Transfer", crypto:"Crypto Payment",
      bkashLabel:"bKash Account Number", nagadLabel:"Nagad Account Number", rocketLabel:"Rocket Account Number",
      bankLabel:"Bank Name", accNo:"Account Number", cryptoMsg:"You will get a 10% discount on the total application fee by paying with cryptocurrency.",
      cryptoSelect:"Select Cryptocurrency", wallet:"Your Wallet Address", cancelBtn:"Cancel", payBtn:"Pay Now"
    },
    bn: { 
      title:"পেমেন্ট পদ্ধতি যুক্ত করুন", bank:"ব্যাংক ট্রান্সফার", crypto:"ক্রিপ্টো পেমেন্ট",
      bkashLabel:"বিকাশ অ্যাকাউন্ট নম্বর", nagadLabel:"নগদ অ্যাকাউন্ট নম্বর", rocketLabel:"রকেট অ্যাকাউন্ট নম্বর",
      bankLabel:"ব্যাংকের নাম", accNo:"অ্যাকাউন্ট নম্বর", cryptoMsg:"ক্রিপ্টোকারেন্সি দিয়ে পেমেন্ট করলে মোট আবেদন ফি-তে ১০% ছাড় পাবেন।",
      cryptoSelect:"ক্রিপ্টোকারেন্সি নির্বাচন করুন", wallet:"আপনার ওয়ালেট ঠিকানা", cancelBtn:"বাতিল", payBtn:"পেমেন্ট করুন"
    }
  };

  let LANG = 'en';
  try { LANG = localStorage.getItem('globalwork_lang') || 'en'; } catch(e) {}
  if(!T[LANG]) LANG = 'en';

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T[LANG][key]) el.innerHTML = T[LANG][key];
    });
    document.documentElement.lang = LANG;
    document.getElementById('langSel').value = LANG;
  }

  document.getElementById('langSel').addEventListener('change', function(e) {
    LANG = e.target.value;
    try { localStorage.setItem('globalwork_lang', LANG); } catch(x) {}
    applyI18n();
  });

  // Tab Switching Logic
  function selectPayment(method, btnElement) {
    // Remove active class from all buttons
    document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('active'));
    // Add active class to clicked button
    btnElement.classList.add('active');

    // Hide all forms
    document.querySelectorAll('.form-group').forEach(form => form.classList.remove('show'));
    
    // Show specific form
    const targetForm = document.getElementById('form-' + method);
    if(targetForm) {
        targetForm.classList.add('show');
    }
  }

  // Coming Soon Toast
  function showComingSoon(method) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = method + " is coming soon!";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function processPayment(event) {
    event.preventDefault();
    alert("Payment processed successfully! (This is a demo)");
  }

  // Initial Setup
  applyI18n();
</script>
</body>
</html>
