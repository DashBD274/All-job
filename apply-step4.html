<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Method | GlobalWork</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:#e6e6e6;color:var(--text-dark);min-height:100vh;line-height:1.5; display: flex; flex-direction: column;}
a{text-decoration:none;color:inherit}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1; width: 100%;}
.container{width:100%;max-width:800px;margin:0 auto;padding:0 20px}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}

/* Lang Select */
#langSel {padding:8px 12px;border:1px solid var(--border);border-radius:40px;font:inherit;font-size:14px;background:var(--light-bg);cursor:pointer}

/* Form Container */
.form-wrapper{padding:40px 20px; display: flex; justify-content: center; flex: 1;}
.form-container{background:#e8e8e8; width:100%; max-width:600px; padding:30px; border-radius:8px; box-shadow:var(--sh-md);}
.form-container h1{font-size:22px; margin-bottom:20px; color:#222; border-bottom:1px solid #ccc; padding-bottom:10px;}

/* Payment Grid */
.payment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
.pay-btn { background: #fff; border: 1px solid #ccc; padding: 12px 8px; border-radius: 6px; text-align: center; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 70px;}
.pay-btn:hover { border-color: var(--primary); background: #f8f9fa; }
.pay-btn.active { border-color: var(--primary); background: #eaf1fb; box-shadow: 0 0 0 2px rgba(18,53,91,0.2); }
.pay-btn img { height: 22px; max-width: 100%; object-fit: contain; }
.pay-btn .icon-fallback { font-size: 22px; line-height: 1; }

/* Crypto Specific Styling */
.pay-btn.crypto-btn img { height: 32px; }
.pay-btn.crypto-btn { border-color: #f7931a; background: #fffaf5; }
.pay-btn.crypto-btn.active { box-shadow: 0 0 0 2px rgba(247,147,26,0.4); border-color: #f7931a; }

/* Discount Badge */
.discount-badge { background: #16a34a; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 12px; margin-left: 5px; vertical-align: middle; }

/* Form Fields */
.form-group { margin-bottom: 20px; display: none; }
.form-group.show { display: block; }
.form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #222; }

/* Input with Copy Button Layout */
.input-group { display: flex; gap: 8px; }
.input-group input { flex: 1; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 13px; outline: none; }
.input-group input[readonly] { background: #f0f0f0; font-weight: bold; color: #c8102e; }
.input-group input:focus { border-color: var(--primary); }

/* Copy Button Style */
.copy-btn { display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #ccc; border-radius: 4px; width: 42px; cursor: pointer; transition: all 0.2s; padding: 0; }
.copy-btn:hover { background: #eaf1fb; border-color: var(--primary); }
.copy-btn svg { width: 18px; height: 18px; fill: #555; }
.copy-btn:hover svg { fill: var(--primary); }

/* Regular Inputs */
.form-group > input, .form-group > select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 13px; outline: none; }
.form-group > input:focus, .form-group > select:focus { border-color: var(--primary); }

/* Buttons */
.form-actions{display:flex; justify-content:flex-end; gap: 15px; margin-top:20px; border-top: 1px solid #ccc; padding-top: 15px;}
.btn{display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; padding:8px 24px; border:none; border-radius:4px; cursor:pointer; transition:all .2s;}
.btn-cancel{background:#e8e8e8; color:#333; border:1px solid #999;}
.btn-cancel:hover{background:#ddd;}
.btn-create{background:#4f46e5; color:#fff; border:none;}
.btn-create:hover{background:#4338ca;}

/* Toast Message */
#toast{position:fixed; bottom:20px; left: 50%; transform: translateX(-50%); background:#16a34a; color:#fff; padding:10px 20px; border-radius:8px; font-size:14px; font-weight: 600; box-shadow:0 4px 12px rgba(0,0,0,.15); opacity:0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;}
#toast.show{opacity:1;}

@media(max-width:640px){
  .payment-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="canada-apply.html" class="logo"><i class="fas fa-briefcase"></i><span>GlobalWork</span></a>
    <select id="langSel">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="hi">हिन्दी</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</header>

<div class="form-wrapper">
  <div class="form-container">
    <h1 data-i18n="title">Add a payment method</h1>
    
    <div class="payment-grid">
      <button type="button" class="pay-btn crypto-btn active" onclick="selectPayment('crypto', this)">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg" alt="Bitcoin" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">₿</span>
        <span data-i18n="crypto">Crypto</span> <span class="discount-badge">10% OFF</span>
      </button>

      <button type="button" class="pay-btn" onclick="selectPayment('bkash', this)">
        <img src="bkash.png" alt="bKash" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">📱</span>
        <span>bKash</span>
      </button>
      
      <button type="button" class="pay-btn" onclick="selectPayment('nagad', this)">
        <img src="nagad.png" alt="Nagad" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">📱</span>
        <span>Nagad</span>
      </button>
      
      <button type="button" class="pay-btn" onclick="selectPayment('rocket', this)">
        <img src="rocket.png" alt="Rocket" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">📱</span>
        <span>Rocket</span>
      </button>
      
      <button type="button" class="pay-btn" onclick="selectPayment('upi', this)">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">🇮🇳</span>
        <span>UPI (India)</span>
      </button>

      <button type="button" class="pay-btn" onclick="selectPayment('gpay', this)">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" alt="Google Pay" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">G Pay</span>
        <span>Google Pay</span>
      </button>

      <button type="button" class="pay-btn" onclick="selectPayment('indianbank', this)">
        <span class="icon-fallback">🇮🇳🏦</span>
        <span data-i18n="indianbank">Indian Bank</span>
      </button>

      <button type="button" class="pay-btn" onclick="selectPayment('bank', this)">
        <span class="icon-fallback">🏦</span>
        <span data-i18n="bank">Bank (BD)</span>
      </button>

      <button type="button" class="pay-btn" onclick="showComingSoon('Card')">
        <span class="icon-fallback">💳</span>
        <span data-i18n="card">Card</span>
      </button>

      <button type="button" class="pay-btn" onclick="showComingSoon('PayPal')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">🅿️</span>
        <span>PayPal</span>
      </button>

      <button type="button" class="pay-btn" onclick="showComingSoon('Apple Pay')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Apple_Pay_logo.svg" alt="Apple Pay" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="icon-fallback" style="display:none;">🍎</span>
        <span>Apple Pay</span>
      </button>
    </div>

    <form action="#" method="POST" onsubmit="processPayment(event)">
      
      <!-- Crypto Form -->
      <div id="form-crypto" class="form-group show">
        <div style="background:#fff; border:1px solid #16a34a; padding:10px; border-radius:6px; margin-bottom:15px; color:#16a34a; font-weight:600; font-size:12px;" data-i18n="cryptoMsg">
          You will get a 10% discount on the total application fee by paying with cryptocurrency.
        </div>
        <label data-i18n="selectCrypto">Select Cryptocurrency</label>
        <select id="crypto-type" onchange="updateCryptoAddress()">
          <option value="BTC">Bitcoin (BTC)</option>
          <option value="USDT">USDT (Tether)</option>
        </select>
        <label style="margin-top:10px;" data-i18n="sendToWallet">Send Payment to (Admin Wallet):</label>
        <div class="input-group">
          <input type="text" id="show-crypto" readonly>
          <button type="button" class="copy-btn" onclick="copyToClipboard('show-crypto')" title="Copy Address">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <label style="margin-top:10px;" data-i18n="yourTxid">Your Wallet Address / TXID</label>
        <input type="text" placeholder="Enter your TXID" required>
      </div>

      <!-- bKash Form -->
      <div id="form-bkash" class="form-group">
        <label data-i18n="sendToNumber">Send Payment to (Admin Number):</label>
        <div class="input-group">
          <input type="text" id="show-bkash" readonly>
          <button type="button" class="copy-btn" onclick="copyToClipboard('show-bkash')" title="Copy Number">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <label style="margin-top:10px;" data-i18n="yourBkash">Your bKash Number</label>
        <input type="text" placeholder="e.g. 017XXXXXXXX">
        <label style="margin-top:10px;" data-i18n="trxid">Transaction ID (TrxID)</label>
        <input type="text" placeholder="Enter TrxID">
      </div>

      <!-- Nagad Form -->
      <div id="form-nagad" class="form-group">
        <label data-i18n="sendToNumber">Send Payment to (Admin Number):</label>
        <div class="input-group">
          <input type="text" id="show-nagad" readonly>
          <button type="button" class="copy-btn" onclick="copyToClipboard('show-nagad')" title="Copy Number">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <label style="margin-top:10px;" data-i18n="yourNagad">Your Nagad Number</label>
        <input type="text" placeholder="e.g. 017XXXXXXXX">
        <label style="margin-top:10px;" data-i18n="trxid">Transaction ID (TrxID)</label>
        <input type="text" placeholder="Enter TrxID">
      </div>

      <!-- Rocket Form -->
      <div id="form-rocket" class="form-group">
        <label data-i18n="sendToNumber">Send Payment to (Admin Number):</label>
        <div class="input-group">
          <input type="text" id="show-rocket" readonly>
          <button type="button" class="copy-btn" onclick="copyToClipboard('show-rocket')" title="Copy Number">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <label style="margin-top:10px;" data-i18n="yourRocket">Your Rocket Number</label>
        <input type="text" placeholder="e.g. 017XXXXXXXX-1">
        <label style="margin-top:10px;" data-i18n="trxid">Transaction ID (TrxID)</label>
        <input type="text" placeholder="Enter TrxID">
      </div>

      <!-- UPI Form -->
      <div id="form-upi" class="form-group">
        <label data-i18n="sendToUPI">Send Payment to (Admin UPI ID):</label>
        <div class="input-group">
          <input type="text" id="show-upi" readonly>
          <button type="button" class="copy-btn" onclick="copyToClipboard('show-upi')" title="Copy UPI ID">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <label style="margin-top:10px;" data-i18n="yourUpi">Your UPI ID or Transaction ID</label>
        <input type="text" placeholder="Enter your UPI ID or TXN ID">
      </div>

      <!-- Google Pay Form -->
      <div id="form-gpay" class="form-group">
        <label data-i18n="sendToUPI">Send Payment to (Admin UPI ID):</label>
        <div class="input-group">
          <input type="text" id="show-gpay" readonly>
          <button type="button" class="copy-btn" onclick="copyToClipboard('show-gpay')" title="Copy UPI ID">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <label style="margin-top:10px;" data-i18n="yourGpay">Your Google Pay UPI ID or Transaction ID</label>
        <input type="text" placeholder="Enter your UPI ID or TXN ID">
      </div>

      <!-- Indian Bank Form -->
      <div id="form-indianbank" class="form-group">
        <div style="background:#fff; padding:10px; border-radius:4px; border:1px solid #ccc; margin-bottom:10px; font-size:13px; line-height:1.6;">
          <strong data-i18n="adminBankDetails">Admin Indian Bank Details:</strong><br>
          <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
             <span id="show-indianbank" style="flex:1; font-weight:bold; color:#c8102e;"></span>
             <button type="button" class="copy-btn" style="height: 30px; width: 30px; padding: 5px;" onclick="copyToClipboard('show-indianbank')" title="Copy Bank Details">
               <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
             </button>
          </div>
        </div>
        <label data-i18n="yourBank">Your Bank Name</label>
        <input type="text" placeholder="Enter your Bank Name">
        <label style="margin-top:10px;" data-i18n="yourAccount">Your Account Number</label>
        <input type="text" placeholder="Enter your Account Number">
        <label style="margin-top:10px;" data-i18n="trxRef">Transaction ID / Reference</label>
        <input type="text" placeholder="Enter Reference Number">
      </div>

      <!-- Bank (Bangladesh) Form -->
      <div id="form-bank" class="form-group">
        <div style="background:#fff; padding:10px; border-radius:4px; border:1px solid #ccc; margin-bottom:10px; font-size:13px; line-height:1.6;">
          <strong data-i18n="adminBankDetailsBD">Admin Bank Details (Bangladesh):</strong><br>
          <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
             <span id="show-bank" style="flex:1; font-weight:bold; color:#c8102e;"></span>
             <button type="button" class="copy-btn" style="height: 30px; width: 30px; padding: 5px;" onclick="copyToClipboard('show-bank')" title="Copy Bank Details">
               <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
             </button>
          </div>
        </div>
        <label data-i18n="yourBank">Your Bank Name</label>
        <input type="text" placeholder="Enter your Bank Name">
        <label style="margin-top:10px;" data-i18n="yourAccount">Your Account Number</label>
        <input type="text" placeholder="Enter your Account Number">
        <label style="margin-top:10px;" data-i18n="trxRef">Transaction ID / Reference</label>
        <input type="text" placeholder="Enter Reference Number">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-i18n="cancel" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn btn-create" data-i18n="submit">Submit Payment</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" data-i18n="copied">Copied to clipboard!</div>

<script>
  const T = {

  let LANG = 'en';
  try { LANG = localStorage.getItem('globalwork_lang') || 'en'; } catch(e) {}
  if(!T[LANG]) LANG = 'en';

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T[LANG][key]) el.innerHTML = T[LANG][key];
    });
    document.documentElement.lang = LANG;
    document.getElementById('langSel').value = LANG;
  }

  document.getElementById('langSel').addEventListener('change', function(e) {
    LANG = e.target.value;
    try { localStorage.setItem('globalwork_lang', LANG); } catch(x) {}
    applyI18n();
  });

  // ✅ সঠিকভাবে LocalStorage থেকে ডেটা রিড করা
  function getPaymentSettings() {
    try {
      const saved = localStorage.getItem('globalwork_payment_settings');
      if (saved) {
        return JSON.parse(saved);
      }
    } catch(e) {
      console.error("Error reading payment settings: ", e);
    }
    return {
      bkash: "01712345678", nagad: "01812345678", rocket: "019123456789-1",
      upi: "globalwork@upi", gpay: "globalwork@okicici",
      indianbank: "HDFC Bank - 50100234567890 (GlobalWork)",
      bank: "Dutch Bangla Bank - 1234567890 (GlobalWork Ltd)",
      usdt: "TXYZ1234567890USDT", btc: "1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa"
    };
  }

  const settings = getPaymentSettings();
  
  document.getElementById('show-bkash').value = settings.bkash || "";
  document.getElementById('show-nagad').value = settings.nagad || "";
  document.getElementById('show-rocket').value = settings.rocket || "";
  document.getElementById('show-upi').value = settings.upi || "";
  document.getElementById('show-gpay').value = settings.gpay || "";
  document.getElementById('show-indianbank').innerText = settings.indianbank || "";
  document.getElementById('show-bank').innerText = settings.bank || "";
  
  function updateCryptoAddress() {
    const type = document.getElementById('crypto-type').value;
    const input = document.getElementById('show-crypto');
    if(type === 'USDT') input.value = settings.usdt || "";
    else input.value = settings.btc || "";
  }
  updateCryptoAddress();

  function selectPayment(method, btnElement) {
    document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    document.querySelectorAll('.form-group').forEach(form => form.classList.remove('show'));
    
    const targetForm = document.getElementById('form-' + method);
    if(targetForm) targetForm.classList.add('show');
  }

  function showComingSoon(method) {
    alert(method + " payment method is coming soon!");
  }

  function processPayment(event) {
    event.preventDefault();
    alert("Payment details submitted successfully! Admin will verify shortly.");
  }

  function copyToClipboard(elementId) {
    const element = document.getElementById(elementId);
    let textToCopy = element.value !== undefined ? element.value : element.innerText;
    
    navigator.clipboard.writeText(textToCopy).then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }).catch(err => {
      console.error('Failed to copy: ', err);
    });
  }

  applyI18n();
</script>
