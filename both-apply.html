<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--ok:#16a34a;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:var(--light-bg);color:var(--text-dark);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{text-decoration:none;color:inherit}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-weight:700;line-height:1.2;letter-spacing:-.02em}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);position:sticky;top:0;z-index:100;padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}
.header-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.userbox{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;padding:9px 20px;border-radius:40px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.1)}
.btn-sm{padding:7px 16px;font-size:.82rem}
.btn-block{width:100%}

/* Page head */
.page-head{background:linear-gradient(120deg,#eaf1fb,#fff,#fdeceb);padding:36px 0 28px;border-bottom:1px solid var(--border)}
.page-head h1{color:var(--primary);font-size:1.9rem;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.page-head p{color:var(--text-muted);font-size:.95rem;max-width:700px}
.flag{display:inline-block;width:36px;height:24px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);vertical-align:middle}
.flag.ca{background:linear-gradient(90deg,#d52b1e 25%,#fff 25% 75%,#d52b1e 75%);position:relative}
.flag.ca::after{content:"🍁";position:absolute;inset:0;text-align:center;line-height:24px;font-size:14px}
.flag.us{background:repeating-linear-gradient(180deg,#b22234 0 7.692%,#fff 7.692% 15.384%);position:relative}
.flag.us::after{content:"";position:absolute;left:0;top:0;width:40%;height:54%;background:#3c3b6e}

/* Toolbar */
.toolbar{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin:22px 0;box-shadow:var(--sh-sm);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-box{flex:1;min-width:220px;display:flex;gap:8px}
.search-box input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font:inherit;font-size:15px;background:var(--light-bg);outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--primary);background:#fff}
.toolbar select{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font:inherit;font-size:14px;background:#fff;cursor:pointer;outline:none}
.toolbar select:focus{border-color:var(--primary)}
.result-info{font-size:.88rem;color:var(--text-muted);margin-bottom:14px}

/* Job list */
.job-list{display:flex;flex-direction:column;gap:14px}
.job-item{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);transition:all .2s;position:relative;border-left:4px solid var(--accent)}
.job-item:hover{transform:translateX(3px);box-shadow:var(--sh-md)}
.job-item h3{color:var(--primary);font-size:1.05rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.job-item .loc{color:var(--text-muted);font-size:.86rem;margin-bottom:4px}
.job-item .meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.8rem;color:var(--text-muted);align-items:center}
.job-item .tag{background:rgba(18,53,91,.08);color:var(--primary);padding:3px 10px;border-radius:20px;font-weight:600}
.job-item .tag.full{background:rgba(22,163,74,.1);color:var(--ok)}
.job-item .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.job-item .posted{position:absolute;top:16px;right:18px;font-size:.75rem;color:var(--text-muted)}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);background:#fff;border-radius:var(--r);border:1px dashed var(--border)}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin:28px 0;flex-wrap:wrap}
.pagination button{min-width:38px;height:38px;border:1.5px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;color:var(--primary);transition:all .15s}
.pagination button:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* Footer */
.site-footer{background:linear-gradient(160deg,var(--primary),#0b2240);color:rgba(255,255,255,.85);padding:30px 0 20px;margin-top:auto;font-size:.85rem;text-align:center}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal-box{background:#fff;border-radius:16px;padding:26px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-box h3{color:var(--primary);margin-bottom:14px;font-size:1.3rem}
.modal-box dl{display:grid;grid-template-columns:120px 1fr;gap:10px 8px;font-size:.92rem;margin-bottom:20px}
.modal-box dt{color:var(--text-muted);font-weight:600}
.modal-box dd{word-break:break-word}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;right:20px;bottom:20px;background:var(--primary);color:#fff;padding:12px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:300;animation:slideIn .3s ease}
.toast.err{background:var(--accent)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

[hidden]{display:none!important}
@media(max-width:640px){
  .header-inner{flex-direction:column;align-items:stretch}
  .header-controls{justify-content:space-between;width:100%}
  .page-head h1{font-size:1.5rem}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{flex-direction:column}
  .job-item .posted{position:static;display:block;margin-top:8px}
}
</style>

  var LANG='en';
  try{LANG=localStorage.getItem('globalwork_lang')||'en'}catch(e){}
  if(!T[LANG])LANG='en';
  function t(k){return T[LANG][k]||T.en[k]||k}
  function applyI18n(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v=t(el.getAttribute('data-i18n')); if(v)el.textContent=v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var v=t(el.getAttribute('data-i18n-ph')); if(v)el.placeholder=v;
    });
    document.documentElement.lang=LANG;
    document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
    $('langSel').value=LANG;
  }
  $('langSel').addEventListener('change',function(e){
    LANG=e.target.value;
    try{localStorage.setItem('globalwork_lang',LANG)}catch(x){}
    applyI18n(); render();
  });

  /* ====== Filter + sort ====== */
  function filtered(){
    var q=state.q.toLowerCase().trim();
    var r=JOBS.filter(function(j){
      if(state.country && j.country!==state.country) return false;
      if(state.type && j.type!==state.type) return false;
      if(q && (j.title+" "+j.city+" "+j.prov).toLowerCase().indexOf(q)===-1) return false;
      return true;
    });
    if(state.sort==='az') r.sort(function(a,b){return a.title.localeCompare(b.title)});
    else if(state.sort==='old') r.sort(function(a,b){return a.posted.localeCompare(b.posted)});
    else r.sort(function(a,b){return b.posted.localeCompare(a.posted)});
    return r;
  }

  /* ====== Render list ====== */
  function render(){
    var all=filtered(), total=all.length;
    var pages=Math.max(1,Math.ceil(total/state.per));
    if(state.page>pages) state.page=pages;
    var start=(state.page-1)*state.per;
    var slice=all.slice(start,start+state.per);
    var list=$('jobList'); list.textContent='';
    $('countTxt').textContent=t('results').replace('{n}',total);

    if(!slice.length){
      var e=document.createElement('div');
      e.className='empty'; e.textContent=t('noResults'); list.appendChild(e);
    } else {
      slice.forEach(function(j){
        var d=document.createElement('div'); d.className='job-item';
        var flagClass = j.country === 'Canada' ? 'ca' : 'us';
        d.innerHTML='<div class="posted">'+j.posted+'</div>'+
          '<h3><span class="flag '+flagClass+'" style="width:24px;height:16px;font-size:10px;line-height:16px;"></span> '+esc(j.title)+'</h3>'+
          '<div class="loc"><i class="fas fa-map-marker-alt"></i> '+esc(j.addr)+'</div>'+
          '<div class="meta">'+
            '<span class="tag">'+esc(j.country)+'</span>'+
            '<span class="tag">'+esc(j.prov)+'</span>'+
            '<span class="tag '+(j.type==='Full Time'?'full':'')+'">'+esc(j.type)+'</span>'+
            '<span>'+esc(j.city)+'</span>'+
          '</div>'+
          '<div class="actions">'+
            '<button class="btn btn-outline btn-sm viewBtn">'+t('view')+'</button>'+
            '<button class="btn btn-accent btn-sm applyBtn">'+t('apply')+'</button>'+
          '</div>';
        d.querySelector('.viewBtn').onclick=function(){openDetail(j)};
        d.querySelector('.applyBtn').onclick=function(){applyJob(j)};
        list.appendChild(d);
      });
    }
    renderPager(pages);
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function renderPager(pages){
    var p=$('pager'); p.textContent='';
    function btn(label,page,disabled,on){
      var b=document.createElement('button'); b.textContent=label;
      if(disabled)b.disabled=true;
      if(on)b.classList.add('on');
      b.onclick=function(){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})};
      p.appendChild(b);
    }
    btn('‹',Math.max(1,state.page-1),state.page===1);
    var start=Math.max(1,state.page-2), end=Math.min(pages,start+4);
    start=Math.max(1,end-4);
    for(var i=start;i<=end;i++) btn(i,i,false,i===state.page);
    btn('›',Math.min(pages,state.page+1),state.page===pages);
  }

  /* ====== Detail modal ====== */
  function openDetail(j){
    var box=$('modalBox');
    box.innerHTML='<h3>'+esc(j.title)+'</h3>'+
      '<dl>'+
        '<dt>'+t('country')+'</dt><dd>'+esc(j.country)+'</dd>'+
        '<dt>'+t('province')+'</dt><dd>'+esc(j.prov)+'</dd>'+
        '<dt>'+t('city')+'</dt><dd>'+esc(j.city)+'</dd>'+
        '<dt>'+t('address')+'</dt><dd>'+esc(j.addr)+'</dd>'+
        '<dt>'+t('type_lbl')+'</dt><dd>'+esc(j.type)+'</dd>'+
        '<dt>'+t('posted')+'</dt><dd>'+esc(j.posted)+'</dd>'+
        '<dt>'+t('description')+'</dt><dd>'+esc(j.desc)+'</dd>'+
      '</dl>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-outline" id="closeBtn">'+t('close')+'</button>'+
        '<button class="btn btn-accent" id="applyBtn2">'+t('applyNow')+'</button>'+
      '</div>';
    $('closeBtn').onclick=closeM;
    $('applyBtn2').onclick=function(){closeM();applyJob(j)};
    $('modal').hidden=false;
  }
  function closeM(){$('modal').hidden=true}
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeM()});

  /* ====== Apply flow (login required) ====== */
  function applyJob(j){
    if(!getSession()){
      toast(t('loginToApply'),true);
      setTimeout(function(){location.href='login.html'},1200);
      return;
    }
    toast(t('applied'));
  }

  /* ====== Toast ====== */
  function toast(msg,err){
    var t=document.createElement('div'); t.className='toast'+(err?' err':'');
    t.textContent=msg; document.body.appendChild(t);
    setTimeout(function(){t.remove()},3000);
  }

  /* ====== Bind controls ====== */
  var debounce;
  $('q').addEventListener('input',function(e){
    clearTimeout(debounce);
    debounce=setTimeout(function(){state.q=e.target.value;state.page=1;render()},250);
  });
  $('searchBtn').addEventListener('click',function(){state.q=$('q').value;state.page=1;render()});
  $('country').addEventListener('change',function(e){state.country=e.target.value;state.page=1;render()});
  $('type').addEventListener('change',function(e){state.type=e.target.value;state.page=1;render()});
  $('sort').addEventListener('change',function(e){state.sort=e.target.value;state.page=1;render()});

  /* ====== Init ====== */
  renderUser();
  applyI18n();
  render();
})();
</script>
