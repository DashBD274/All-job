<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply in Canada | GlobalWork</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#12355b;--primary-light:#245587;--accent:#c8102e;--light-bg:#F5F7FA;--white:#fff;--text-dark:#1E2A3A;--text-muted:#5E6F8D;--border:#E2E8F0;--ok:#16a34a;--sh-sm:0 4px 12px rgba(0,0,0,.04);--sh-md:0 8px 24px rgba(0,0,0,.06);--r:14px;--r-sm:10px}
body{font-family:'Inter',sans-serif;background:var(--light-bg);color:var(--text-dark);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{text-decoration:none;color:inherit}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-weight:700;line-height:1.2;letter-spacing:-.02em}

/* Header */
.site-header{background:var(--white);box-shadow:var(--sh-sm);position:sticky;top:0;z-index:100;padding:12px 0;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#d52b1e 0 33%,#fff 33% 50%,#3c3b6e 50% 66%,#b22234 66%) 1}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--primary)}
.logo i{color:var(--accent);font-size:1.6rem}
.header-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.userbox{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;padding:9px 20px;border-radius:40px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.1)}
.btn-sm{padding:7px 16px;font-size:.82rem}
.btn-block{width:100%}

/* Page head */
.page-head{background:linear-gradient(120deg,#eaf1fb,#fff,#fdeceb);padding:36px 0 28px;border-bottom:1px solid var(--border)}
.page-head h1{color:var(--primary);font-size:1.9rem;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.page-head p{color:var(--text-muted);font-size:.95rem;max-width:700px}
.flag{display:inline-block;width:36px;height:24px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);vertical-align:middle}
.flag.ca{background:linear-gradient(90deg,#d52b1e 25%,#fff 25% 75%,#d52b1e 75%);position:relative}
.flag.ca::after{content:"🍁";position:absolute;inset:0;text-align:center;line-height:24px;font-size:14px}

/* Toolbar */
.toolbar{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin:22px 0;box-shadow:var(--sh-sm);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-box{flex:1;min-width:220px;display:flex;gap:8px}
.search-box input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font:inherit;font-size:15px;background:var(--light-bg);outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--primary);background:#fff}
.toolbar select{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font:inherit;font-size:14px;background:#fff;cursor:pointer;outline:none}
.toolbar select:focus{border-color:var(--primary)}
.result-info{font-size:.88rem;color:var(--text-muted);margin-bottom:14px}

/* Job list */
.job-list{display:flex;flex-direction:column;gap:14px}
.job-item{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);transition:all .2s;position:relative;border-left:4px solid var(--accent)}
.job-item:hover{transform:translateX(3px);box-shadow:var(--sh-md)}
.job-item h3{color:var(--primary);font-size:1.05rem;margin-bottom:6px}
.job-item .loc{color:var(--text-muted);font-size:.86rem;margin-bottom:4px}
.job-item .meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.8rem;color:var(--text-muted);align-items:center}
.job-item .tag{background:rgba(18,53,91,.08);color:var(--primary);padding:3px 10px;border-radius:20px;font-weight:600}
.job-item .tag.full{background:rgba(22,163,74,.1);color:var(--ok)}
.job-item .tag.it{background:rgba(200,16,46,.1);color:var(--accent)}
.job-item .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.job-item .posted{position:absolute;top:16px;right:18px;font-size:.75rem;color:var(--text-muted)}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);background:#fff;border-radius:var(--r);border:1px dashed var(--border)}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin:28px 0;flex-wrap:wrap}
.pagination button{min-width:38px;height:38px;border:1.5px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;color:var(--primary);transition:all .15s}
.pagination button:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* Footer */
.site-footer{background:linear-gradient(160deg,var(--primary),#0b2240);color:rgba(255,255,255,.85);padding:30px 0 20px;margin-top:auto;font-size:.85rem;text-align:center}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal-box{background:#fff;border-radius:16px;padding:26px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-box h3{color:var(--primary);margin-bottom:14px;font-size:1.3rem}
.modal-box dl{display:grid;grid-template-columns:120px 1fr;gap:10px 8px;font-size:.92rem;margin-bottom:20px}
.modal-box dt{color:var(--text-muted);font-weight:600}
.modal-box dd{word-break:break-word}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;right:20px;bottom:20px;background:var(--primary);color:#fff;padding:12px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:300;animation:slideIn .3s ease}
.toast.err{background:var(--accent)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

[hidden]{display:none!important}
@media(max-width:640px){
  .header-inner{flex-direction:column;align-items:stretch}
  .header-controls{justify-content:space-between;width:100%}
  .page-head h1{font-size:1.5rem}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{flex-direction:column}
  .job-item .posted{position:static;display:block;margin-top:8px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><i class="fas fa-briefcase"></i><span>GlobalWork</span></a>
    <div class="header-controls">
      <select id="langSel" style="padding:8px 12px;border:1px solid var(--border);border-radius:40px;font:inherit;font-size:14px;background:var(--light-bg);cursor:pointer">
        <option value="en">English</option>
        <option value="bn">বাংলা</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select>
      <span id="userBox" class="userbox" hidden>
        <i class="fas fa-user-circle"></i><span id="userName"></span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Log Out</button>
      </span>
      <a href="login.html" id="loginBtn" class="btn btn-outline btn-sm">Log In</a>
      <a href="signup.html" id="signupBtn" class="btn btn-primary btn-sm">Sign Up</a>
    </div>
  </div>
</header>

<section class="page-head">
  <div class="container">
    <h1><span class="flag ca"></span> <span data-i18n="pageTitle">Apply in Canada</span></h1>
    <p data-i18n="pageSub">Browse official job listings across Canada. Select a job to view details and apply.</p>
  </div>
</section>

<main class="container">
  <div class="toolbar">
    <div class="search-box">
      <input id="q" type="text" placeholder="Search by title, city or province…" data-i18n-ph="qPh">
      <button class="btn btn-primary" id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <select id="prov">
      <option value="" data-i18n="provAll">All Provinces</option>
      <option value="Ontario">Ontario</option>
      <option value="British Columbia">British Columbia</option>
      <option value="Alberta">Alberta</option>
      <option value="Quebec">Quebec</option>
      <option value="Manitoba">Manitoba</option>
      <option value="Saskatchewan">Saskatchewan</option>
      <option value="Nova Scotia">Nova Scotia</option>
    </select>
    <select id="type">
      <option value="" data-i18n="typeAll">All Types</option>
      <option value="Full Time" data-i18n="typeFull">Full Time</option>
      <option value="Part Time" data-i18n="typePart">Part Time</option>
      <option value="Seasonal" data-i18n="typeSeasonal">Seasonal</option>
    </select>
    <select id="sort">
      <option value="new" data-i18n="sortNew">Newest first</option>
      <option value="old" data-i18n="sortOld">Oldest first</option>
      <option value="az" data-i18n="sortAZ">Title A–Z</option>
    </select>
  </div>

  <div class="result-info"><span id="countTxt"></span></div>
  <div class="job-list" id="jobList"></div>
  <div class="pagination" id="pager"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <p data-i18n="footerTxt">© 2026 GlobalWork — Connecting talent with Canada.</p>
  </div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
(function(){
  var JOBS = [];
  
  var provinces = ["Ontario", "British Columbia", "Alberta", "Quebec", "Manitoba", "Saskatchewan", "Nova Scotia"];
  var cities = {
    "Ontario": ["Toronto", "Brampton", "Mississauga", "Cornwall", "Leamington"],
    "British Columbia": ["Vancouver", "Surrey", "Victoria", "Kelowna", "Richmond"],
    "Alberta": ["Calgary", "Edmonton", "Red Deer", "Lethbridge", "Fort McMurray"],
    "Quebec": ["Montreal", "Quebec City", "Boucherville", "Laval", "Gatineau"],
    "Manitoba": ["Winnipeg", "Brandon", "Steinbach", "Portage la Prairie", "Thompson"],
    "Saskatchewan": ["Saskatoon", "Regina", "Prince Albert", "Moose Jaw", "Yorkton"],
    "Nova Scotia": ["Halifax", "Sydney", "Truro", "New Glasgow", "Bridgewater"]
  };
  
  var generalJobs = ["Farm Worker", "Greenhouse Labourer", "Food Processing Worker", "Livestock Handler", "Landscaping Assistant", "Hotel Housekeeper", "Seafood Processor", "Warehouse Associate", "Truck Driver", "Construction Helper", "Production Supervisor", "Quality Assurance Technician"];
  var itJobs = ["Software Developer", "IT Support Specialist", "Data Analyst", "Web Developer", "Network Administrator"];
  var companies = ["Maple Leaf Farms", "Northern Harvest", "Canadian Tech Solutions", "Greenhouse Tech", "Rocky Mountain Hospitality", "Toronto IT Group", "Vancouver Seafoods", "Prairie Livestock", "Ontario Manufacturing", "Quebec Logistics"];

  function generateJob(id, title, company, prov, city, type, isIT) {
    var street = Math.floor(Math.random() * 9000) + 100;
    var streetName = ["Main St", "Industrial Dr", "King Ave", "Queen St", "Maple Rd", "Broadway"][Math.floor(Math.random() * 6)];
    var postal = String.fromCharCode(65 + Math.floor(Math.random() * 26)) + Math.floor(Math.random() * 9) + String.fromCharCode(65 + Math.floor(Math.random() * 26)) + " " + Math.floor(Math.random() * 9) + String.fromCharCode(65 + Math.floor(Math.random() * 26)) + Math.floor(Math.random() * 9);
    var month = Math.floor(Math.random() * 12) + 1;
    var day = Math.floor(Math.random() * 28) + 1;
    var dateStr = "2026-" + (month < 10 ? "0" + month : month) + "-" + (day < 10 ? "0" + day : day);
    var desc = isIT ? "IT position requiring relevant technical skills. Competitive salary and benefits package offered." : "General labour position. No previous experience required. On-the-job training provided.";
    return { id: id, title: title, company: company, prov: prov, city: city, addr: street + " " + streetName + ", " + city + ", " + prov + " " + postal, type: type, posted: dateStr, desc: desc, isIT: isIT };
  }

  for (var i = 0; i < 80; i++) {
    var prov = provinces[i % provinces.length];
    var cityArr = cities[prov];
    var city = cityArr[i % cityArr.length];
    var title = generalJobs[i % generalJobs.length];
    var comp = companies[i % companies.length];
    var type = ["Full Time", "Part Time", "Seasonal"][i % 3];
    JOBS.push(generateJob(i + 1, title, comp, prov, city, type, false));
  }

  for (var j = 0; j < 5; j++) {
    var prov = provinces[(j + 2) % provinces.length];
    var cityArr = cities[prov];
    var city = cityArr[(j + 1) % cityArr.length];
    var title = itJobs[j % itJobs.length];
    var comp = companies[(j + 2) % companies.length];
    JOBS.push(generateJob(100 + j, title, comp, prov, city, "Full Time", true));
  }

  var state = {page:1, per:10, q:"", prov:"", type:"", sort:"new"};
  var $ = function(id){return document.getElementById(id)};

  function getSession(){try{return localStorage.getItem('globalwork_session')}catch(e){return null}}
  function getUsers(){try{return JSON.parse(localStorage.getItem('globalwork_users')||'{}')}catch(e){return{}}}
  
  function renderUser(){
    var em=getSession(), u=em&&getUsers()[em];
    $('userBox').hidden=!u;
    $('loginBtn').hidden=!!u;
    $('signupBtn').hidden=!!u;
    if(u)$('userName').textContent=u.fullName;
  }
  $('logoutBtn').addEventListener('click',function(){
    try{localStorage.removeItem('globalwork_session')}catch(e){}
    renderUser(); toast('Logged out');
  });

  var T = {
    en:{ pageTitle:"Apply in Canada", pageSub:"Browse official job listings across Canada.", qPh:"Search by title, city or province…", provAll:"All Provinces", typeAll:"All Types", typeFull:"Full Time", typePart:"Part Time", typeSeasonal:"Seasonal", sortNew:"Newest first", sortOld:"Oldest first", sortAZ:"Title A–Z", footerTxt:"© 2026 GlobalWork", results:"{n} jobs found", noResults:"No jobs found.", view:"View Details", apply:"Apply", applyNow:"Apply Now", close:"Close", province:"Province", city:"City", address:"Address", type_lbl:"Job Type", posted:"Posted", description:"Description", company:"Company", loginToApply:"Please log in to apply.", applied:"Application submitted!" },
    bn:{ pageTitle:"কানাডায় আবেদন করুন", pageSub:"কানাডা জুড়ে চাকরির তালিকা দেখুন।", qPh:"শিরোনাম, শহর বা প্রদেশ দিয়ে খুঁজুন…", provAll:"সব প্রদেশ", typeAll:"সব ধরন", typeFull:"ফুল টাইম", typePart:"পার্ট টাইম", typeSeasonal:"মৌসুমী", sortNew:"নতুন আগে", sortOld:"পুরোনো আগে", sortAZ:"শিরোনাম A–Z", footerTxt:"© ২০২৬ GlobalWork", results:"{n} টি চাকরি পাওয়া গেছে", noResults:"কোনো চাকরি পাওয়া যায়নি।", view:"বিস্তারিত দেখুন", apply:"আবেদন করুন", applyNow:"এখনই আবেদন করুন", close:"বন্ধ", province:"প্রদেশ", city:"শহর", address:"ঠিকানা", type_lbl:"চাকরির ধরন", posted:"প্রকাশিত", description:"বিবরণ", company:"কোম্পানি", loginToApply:"আবেদন করতে লগইন করুন।", applied:"আবেদন জমা হয়েছে!" }
  };
  
  var LANG='en';
  try{LANG=localStorage.getItem('globalwork_lang')||'en'}catch(e){}
  if(!T[LANG]) LANG='en';
  
  function t(k){return T[LANG][k]||T.en[k]||k}
  
  function applyI18n(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v=t(el.getAttribute('data-i18n')); if(v)el.textContent=v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var v=t(el.getAttribute('data-i18n-ph')); if(v)el.placeholder=v;
    });
    document.documentElement.lang=LANG;
    $('langSel').value=LANG;
  }
  
  $('langSel').addEventListener('change',function(e){
    LANG=e.target.value;
    try{localStorage.setItem('globalwork_lang',LANG)}catch(x){}
    applyI18n(); render();
  });

  function filtered(){
    var q=state.q.toLowerCase().trim();
    var r=JOBS.filter(function(j){
      if(state.prov && j.prov!==state.prov) return false;
      if(state.type && j.type!==state.type) return false;
      if(q && (j.title+" "+j.city+" "+j.prov+" "+j.company).toLowerCase().indexOf(q)===-1) return false;
      return true;
    });
    if(state.sort==='az') r.sort(function(a,b){return a.title.localeCompare(b.title)});
    else if(state.sort==='old') r.sort(function(a,b){return a.posted.localeCompare(b.posted)});
    else r.sort(function(a,b){return b.posted.localeCompare(a.posted)});
    return r;
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function render(){
    var all=filtered(), total=all.length;
    var pages=Math.max(1,Math.ceil(total/state.per));
    if(state.page>pages) state.page=pages;
    var start=(state.page-1)*state.per;
    var slice=all.slice(start,start+state.per);
    var list=$('jobList'); list.textContent='';
    $('countTxt').textContent=t('results').replace('{n}',total);

    if(!slice.length){
      var e=document.createElement('div');
      e.className='empty'; 
      e.textContent=t('noResults'); 
      list.appendChild(e);
    } else {
      slice.forEach(function(j){
        var d=document.createElement('div'); d.className='job-item';
        var itBadge = j.isIT ? '<span class="tag it">IT</span>' : '';
        d.innerHTML='<div class="posted">'+j.posted+'</div>'+
          '<h3>'+esc(j.title)+'</h3>'+
          '<div class="loc"><i class="fas fa-map-marker-alt"></i> '+esc(j.company)+' — '+esc(j.addr)+'</div>'+
          '<div class="meta">'+
            '<span class="tag">'+esc(j.prov)+'</span>'+
            '<span class="tag '+(j.type==='Full Time'?'full':'')+'">'+esc(j.type)+'</span>'+
            itBadge +
            '<span>'+esc(j.city)+'</span>'+
          '</div>'+
          '<div class="actions">'+
            '<button class="btn btn-outline btn-sm viewBtn">'+t('view')+'</button>'+
            '<button class="btn btn-accent btn-sm applyBtn">'+t('apply')+'</button>'+
          '</div>';
        d.querySelector('.viewBtn').onclick=function(){openDetail(j)};
        d.querySelector('.applyBtn').onclick=function(){applyJob(j)};
        list.appendChild(d);
      });
    }
    renderPager(pages);
  }

  function renderPager(pages){
    var p=$('pager'); p.textContent='';
    function btn(label,page,disabled,on){
      var b=document.createElement('button'); b.textContent=label;
      if(disabled)b.disabled=true;
      if(on)b.classList.add('on');
      b.onclick=function(){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})};
      p.appendChild(b);
    }
    btn('‹',Math.max(1,state.page-1),state.page===1);
    var start=Math.max(1,state.page-2), end=Math.min(pages,start+4);
    start=Math.max(1,end-4);
    for(var i=start;i<=end;i++) btn(i,i,false,i===state.page);
    btn('›',Math.min(pages,state.page+1),state.page===pages);
  }

  function openDetail(j){
    var box=$('modalBox');
    box.innerHTML='<h3>'+esc(j.title)+'</h3>'+
      '<dl>'+
        '<dt>'+t('company')+'</dt><dd>'+esc(j.company)+'</dd>'+
        '<dt>'+t('province')+'</dt><dd>'+esc(j.prov)+'</dd>'+
        '<dt>'+t('city')+'</dt><dd>'+esc(j.city)+'</dd>'+
        '<dt>'+t('address')+'</dt><dd>'+esc(j.addr)+'</dd>'+
        '<dt>'+t('type_lbl')+'</dt><dd>'+esc(j.type)+'</dd>'+
        '<dt>'+t('posted')+'</dt><dd>'+esc(j.posted)+'</dd>'+
        '<dt>'+t('description')+'</dt><dd>'+esc(j.desc)+'</dd>'+
      '</dl>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-outline" id="closeBtn">'+t('close')+'</button>'+
        '<button class="btn btn-accent" id="applyBtn2">'+t('applyNow')+'</button>'+
      '</div>';
    $('closeBtn').onclick=closeM;
    $('applyBtn2').onclick=function(){closeM();applyJob(j)};
    $('modal').hidden=false;
  }
  
  function closeM(){$('modal').hidden=true}
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeM()});

  function applyJob(j){
    if(!getSession()){
      toast(t('loginToApply'),true);
      setTimeout(function(){location.href='login.html'},1200);
      return;
    }
    toast(t('applied'));
  }

  function toast(msg,err){
    var t=document.createElement('div'); t.className='toast'+(err?' err':'');
    t.textContent=msg; document.body.appendChild(t);
    setTimeout(function(){t.remove()},3000);
  }

  var debounce;
  $('q').addEventListener('input',function(e){
    clearTimeout(debounce);
    debounce=setTimeout(function(){state.q=e.target.value;state.page=1;render()},250);
  });
  $('searchBtn').addEventListener('click',function(){state.q=$('q').value;state.page=1;render()});
  $('prov').addEventListener('change',function(e){state.prov=e.target.value;state.page=1;render()});
  $('type').addEventListener('change',function(e){state.type=e.target.value;state.page=1;render()});
  $('sort').addEventListener('change',function(e){state.sort=e.target.value;state.page=1;render()});

  renderUser();
  applyI18n();
  render();
})();
</script>
</body>
</html>
