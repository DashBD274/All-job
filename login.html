<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pageTitle">Log In | GlobalWork</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#12355b;--pl:#245587;--a:#c8102e;--bd:#E2E8F0;--mu:#5E6F8D;--bg:#F5F7FA}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#eaf1fb,#fff,#fdeceb);color:#1E2A3A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:440px;background:#fff;border:1px solid var(--bd);border-top:4px solid var(--a);border-radius:16px;padding:32px 28px;box-shadow:0 8px 24px rgba(0,0,0,.08);position:relative}
.top-bar{display:flex;justify-content:flex-end;margin-bottom:15px}
select.lang-sel{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:14px;background:var(--bg);cursor:pointer;outline:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;color:var(--p);margin-bottom:18px}
.f{display:inline-block;width:30px;height:20px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.f.ca{background:linear-gradient(90deg,#d52b1e 25%,#fff 25% 75%,#d52b1e 75%);position:relative}
.f.ca::after{content:"\1F341";position:absolute;inset:0;font-size:11px;text-align:center;line-height:20px}
.f.us{background:repeating-linear-gradient(180deg,#b22234 0 7.692%,#fff 7.692% 15.384%);position:relative;margin-left:-8px}
.f.us::after{content:"";position:absolute;left:0;top:0;width:40%;height:54%;background:#3c3b6e}
h1{font-size:1.4rem;color:var(--p);margin-bottom:4px}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:22px}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);outline:none}
input:focus{border-color:var(--p);background:#fff}
button,.btn{display:inline-block;font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:40px;background:var(--p);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
button:hover{background:var(--pl)}
.full{width:100%;margin-top:22px}
.msg{margin-top:14px;font-size:.88rem;padding:10px 12px;border-radius:10px;display:none}
.msg.err{display:block;background:#FDECEC;color:#9B1C1C}
.msg.ok{display:block;background:#E8F6EC;color:#1E6B34}
.alt{text-align:center;margin-top:16px;font-size:.88rem;color:var(--mu)}
.alt a{color:var(--p);font-weight:600;text-decoration:none}
.note{margin-top:14px;font-size:.78rem;color:var(--mu);text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="top-bar">
    <select id="langSel" class="lang-sel">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="hi">हिन्दी</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="brand"><span><span class="f ca"></span><span class="f us"></span></span> GlobalWork</div>
  
  <h1 data-i18n="heading">Log In</h1>
  <p class="sub" data-i18n="subheading">Welcome back</p>
  
  <form id="f" novalidate>
    <label for="e" data-i18n="lblEmail">Email</label>
    <input id="e" type="email" autocomplete="email">
    
    <label for="w" data-i18n="lblPass">Password</label>
    <input id="w" type="password" autocomplete="current-password">
    
    <button class="full" type="submit" data-i18n="btnLogin">Log In</button>
    <div id="m" class="msg"></div>
  </form>
  
  <p class="alt"><span data-i18n="noAccount">No account?</span> <a href="signup.html" data-i18n="signUp">Sign Up</a></p>
  <p class="note" data-i18n="demoNote">Your login is secure and saved online.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// ====== আপনার নতুন Firebase কনফিগারেশন ======
const firebaseConfig = {
  apiKey: "AIzaSyDxUBNv7zrtk27g1nZ4F7xFJZ-oRODrh9E",
  authDomain: "globalwork-app.firebaseapp.com",
  projectId: "globalwork-app",
  storageBucket: "globalwork-app.firebasestorage.app",
  messagingSenderId: "974955802658",
  appId: "1:974955802658:web:e1b45c355e3f0e2b26da7b",
  measurementId: "G-4TSHNJE7TV"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ====== Translation Logic ======
var T = {
  en: { pageTitle: "Log In | GlobalWork", heading: "Log In", subheading: "Welcome back", lblEmail: "Email", lblPass: "Password", btnLogin: "Log In", noAccount: "No account?", signUp: "Sign Up", demoNote: "Your login is secure and saved online.", errLogin: "Incorrect email or password", errFill: "Fill in all fields", okLogin: "Logged in! Redirecting..." },
  bn: { pageTitle: "লগইন | GlobalWork", heading: "লগইন", subheading: "আবার স্বাগতম", lblEmail: "ইমেল", lblPass: "পাসওয়ার্ড", btnLogin: "লগইন করুন", noAccount: "অ্যাকাউন্ট নেই?", signUp: "সাইন আপ", demoNote: "আপনার লগইন নিরাপদ ও অনলাইনে সেভ থাকে।", errLogin: "ইমেল বা পাসওয়ার্ড ভুল", errFill: "সব ঘর পূরণ করুন", okLogin: "লগইন সফল! অপেক্ষা করুন..." },
  es: { pageTitle: "Iniciar sesión | GlobalWork", heading: "Iniciar sesión", subheading: "Bienvenido de nuevo", lblEmail: "Correo electrónico", lblPass: "Contraseña", btnLogin: "Iniciar sesión", noAccount: "¿No tienes cuenta?", signUp: "Registrarse", demoNote: "Su inicio de sesión es seguro y se guarda en línea.", errLogin: "Correo o contraseña incorrectos", errFill: "Complete todos los campos", okLogin: "¡Sesión iniciada! Redirigiendo..." },
  fr: { pageTitle: "Connexion | GlobalWork", heading: "Connexion", subheading: "Bon retour", lblEmail: "E-mail", lblPass: "Mot de passe", btnLogin: "Se connecter", noAccount: "Pas de compte ?", signUp: "S'inscrire", demoNote: "Votre connexion est sécurisée et enregistrée en ligne.", errLogin: "E-mail ou mot de passe incorrect", errFill: "Remplissez tous les champs", okLogin: "Connecté ! Redirection..." },
  de: { pageTitle: "Anmelden | GlobalWork", heading: "Anmelden", subheading: "Willkommen zurück", lblEmail: "E-Mail", lblPass: "Passwort", btnLogin: "Anmelden", noAccount: "Kein Konto?", signUp: "Registrieren", demoNote: "Ihre Anmeldung ist sicher und wird online gespeichert.", errLogin: "Falsche E-Mail oder Passwort", errFill: "Alle Felder ausfüllen", okLogin: "Angemeldet! Weiterleitung..." },
  pt: { pageTitle: "Entrar | GlobalWork", heading: "Entrar", subheading: "Bem-vindo de volta", lblEmail: "E-mail", lblPass: "Senha", btnLogin: "Entrar", noAccount: "Não tem conta?", signUp: "Cadastrar-se", demoNote: "Seu login é seguro e salvo online.", errLogin: "E-mail ou senha incorretos", errFill: "Preencha todos os campos", okLogin: "Conectado! Redirecionando..." },
  hi: { pageTitle: "लॉग इन | GlobalWork", heading: "लॉग इन", subheading: "वापसी पर स्वागत है", lblEmail: "ईमेल", lblPass: "पासवर्ड", btnLogin: "लॉग इन करें", noAccount: "खाता नहीं है?", signUp: "साइन अप करें", demoNote: "आपका लॉगिन सुरक्षित है और ऑनलाइन सहेजा जाता है।", errLogin: "गलत ईमेल या पासवर्ड", errFill: "सभी फ़ील्ड भरें", okLogin: "लॉग इन हो गया! रीडायरेक्ट हो रहा है..." },
  ar: { pageTitle: "تسجيل الدخول | GlobalWork", heading: "تسجيل الدخول", subheading: "مرحبًا بعودتك", lblEmail: "البريد الإلكتروني", lblPass: "كلمة المرور", btnLogin: "تسجيل الدخول", noAccount: "ليس لديك حساب؟", signUp: "إنشاء حساب", demoNote: "تسجيل الدخول آمن ويتم حفظه عبر الإنترنت.", errLogin: "البريد الإلكتروني أو كلمة المرور غير صحيحة", errFill: "املأ جميع الحقول", okLogin: "تم تسجيل الدخول! جارٍ إعادة التوجيه..." },
  zh: { pageTitle: "登录 | GlobalWork", heading: "登录", subheading: "欢迎回来", lblEmail: "电子邮箱", lblPass: "密码", btnLogin: "登录", noAccount: "还没有账户？", signUp: "注册", demoNote: "您的登录是安全的，并保存在线。", errLogin: "邮箱或密码错误", errFill: "请填写所有字段", okLogin: "已登录！正在跳转..." },
  ja: { pageTitle: "ログイン | GlobalWork", heading: "ログイン", subheading: "おかえりなさい", lblEmail: "メールアドレス", lblPass: "パスワード", btnLogin: "ログイン", noAccount: "アカウントをお持ちでないですか？", signUp: "新規登録", demoNote: "ログインは安全でオンラインに保存されます。", errLogin: "メールアドレスまたはパスワードが間違っています", errFill: "すべての項目を入力してください", okLogin: "ログインしました！リダイレクト中..." }
};

var currentLang = 'en';
try { currentLang = localStorage.getItem('globalwork_lang') || 'en'; } catch(e){}
if (!T[currentLang]) currentLang = 'en';

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (T[currentLang][key]) {
      if (el.tagName === 'TITLE') {
        document.title = T[currentLang][key];
      } else {
        el.textContent = T[currentLang][key];
      }
    }
  });
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
}

var langSel = document.getElementById('langSel');
langSel.value = currentLang;
applyI18n();

langSel.addEventListener('change', function(e) {
  currentLang = e.target.value;
  try { localStorage.setItem('globalwork_lang', currentLang); } catch(e){}
  applyI18n();
});

// ====== Firebase Login Logic ======
function show(el,cls,t){el.className='msg '+cls;el.textContent=t}

document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var m = document.getElementById('m');
  var e = document.getElementById('e').value.trim().toLowerCase();
  var w = document.getElementById('w').value;
  var t = T[currentLang];

  if(!e || !w){ show(m,'err',t.errFill); return; }

  show(m, 'ok', 'Checking...'); 

  try {
    await signInWithEmailAndPassword(auth, e, w);
    show(m, 'ok', t.okLogin);
    setTimeout(function(){ location.href = 'index.html'; }, 1000);

  } catch (error) {
    show(m, 'err', t.errLogin);
  }
});
</script>
</body>
</html>
