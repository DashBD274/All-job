<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pageTitle">Sign Up | GlobalWork</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#12355b;--pl:#245587;--a:#c8102e;--bd:#E2E8F0;--mu:#5E6F8D;--bg:#F5F7FA}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#eaf1fb,#fff,#fdeceb);color:#1E2A3A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:440px;background:#fff;border:1px solid var(--bd);border-top:4px solid var(--a);border-radius:16px;padding:32px 28px;box-shadow:0 8px 24px rgba(0,0,0,.08);position:relative}
.top-bar{display:flex;justify-content:flex-end;margin-bottom:15px}
select.lang-sel{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:14px;background:var(--bg);cursor:pointer;outline:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;color:var(--p);margin-bottom:18px}
.f{display:inline-block;width:30px;height:20px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.f.ca{background:linear-gradient(90deg,#d52b1e 25%,#fff 25% 75%,#d52b1e 75%);position:relative}
.f.ca::after{content:"\1F341";position:absolute;inset:0;font-size:11px;text-align:center;line-height:20px}
.f.us{background:repeating-linear-gradient(180deg,#b22234 0 7.692%,#fff 7.692% 15.384%);position:relative;margin-left:-8px}
.f.us::after{content:"";position:absolute;left:0;top:0;width:40%;height:54%;background:#3c3b6e}
h1{font-size:1.4rem;color:var(--p);margin-bottom:4px}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:22px}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);outline:none}
input:focus{border-color:var(--p);background:#fff}
button,.btn{display:inline-block;font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:40px;background:var(--p);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
button:hover{background:var(--pl)}
.full{width:100%;margin-top:22px}
.msg{margin-top:14px;font-size:.88rem;padding:10px 12px;border-radius:10px;display:none}
.msg.err{display:block;background:#FDECEC;color:#9B1C1C}
.msg.ok{display:block;background:#E8F6EC;color:#1E6B34}
.alt{text-align:center;margin-top:16px;font-size:.88rem;color:var(--mu)}
.alt a{color:var(--p);font-weight:600;text-decoration:none}
.note{margin-top:14px;font-size:.78rem;color:var(--mu);text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="top-bar">
    <select id="langSel" class="lang-sel">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="hi">हिन्दी</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="brand"><span><span class="f ca"></span><span class="f us"></span></span> GlobalWork</div>
  
  <h1 data-i18n="heading">Sign Up</h1>
  <p class="sub" data-i18n="subheading">Create your account</p>
  
  <form id="f" novalidate>
    <label for="n" data-i18n="lblName">Full Name</label>
    <input id="n" autocomplete="name">
    
    <label for="e" data-i18n="lblEmail">Email</label>
    <input id="e" type="email" autocomplete="email">
    
    <label for="p" data-i18n="lblPhone">Phone</label>
    <input id="p" type="tel" autocomplete="tel">
    
    <label for="w" data-i18n="lblPass">Password (min 6)</label>
    <input id="w" type="password" autocomplete="new-password">
    
    <button class="full" type="submit" data-i18n="btnSignup">Create Account</button>
    <div id="m" class="msg"></div>
  </form>
  
  <p class="alt"><span data-i18n="hasAccount">Already have an account?</span> <a href="login.html" data-i18n="logIn">Log In</a></p>
  <p class="note" data-i18n="demoNote">Demo: data is saved only in this browser.</p>
</div>

<script>
// ====== Translation Logic (10 Languages) ======
var T = {
  en: { pageTitle: "Sign Up | GlobalWork", heading: "Sign Up", subheading: "Create your account", lblName: "Full Name", lblEmail: "Email", lblPhone: "Phone", lblPass: "Password (min 6)", btnSignup: "Create Account", hasAccount: "Already have an account?", logIn: "Log In", demoNote: "Demo: data is saved only in this browser.", errFill: "Fill in all fields", errEmail: "Enter a valid email", errPass: "Password min 6 characters", errExists: "Email already registered", errSave: "Could not save", okSignup: "Account created!" },
  bn: { pageTitle: "সাইন আপ | GlobalWork", heading: "সাইন আপ", subheading: "আপনার অ্যাকাউন্ট তৈরি করুন", lblName: "পুরো নাম", lblEmail: "ইমেল", lblPhone: "ফোন নম্বর", lblPass: "পাসওয়ার্ড (কমপক্ষে ৬)", btnSignup: "অ্যাকাউন্ট তৈরি করুন", hasAccount: "অ্যাকাউন্ট আছে?", logIn: "লগইন", demoNote: "ডেমো: তথ্য শুধু এই ব্রাউজারে থাকে।", errFill: "সব ঘর পূরণ করুন", errEmail: "সঠিক ইমেল দিন", errPass: "পাসওয়ার্ড কমপক্ষে ৬ অক্ষর", errExists: "এই ইমেল আগে থেকেই আছে", errSave: "সংরক্ষণ করা যায়নি", okSignup: "অ্যাকাউন্ট তৈরি হয়েছে!" },
  es: { pageTitle: "Registrarse | GlobalWork", heading: "Registrarse", subheading: "Crea tu cuenta", lblName: "Nombre completo", lblEmail: "Correo electrónico", lblPhone: "Teléfono", lblPass: "Contraseña (mín 6)", btnSignup: "Crear cuenta", hasAccount: "¿Ya tienes cuenta?", logIn: "Iniciar sesión", demoNote: "Demo: los datos se guardan solo en este navegador.", errFill: "Complete todos los campos", errEmail: "Ingrese un correo válido", errPass: "Contraseña mín 6 caracteres", errExists: "Correo ya registrado", errSave: "No se pudo guardar", okSignup: "¡Cuenta creada!" },
  fr: { pageTitle: "S'inscrire | GlobalWork", heading: "S'inscrire", subheading: "Créez votre compte", lblName: "Nom complet", lblEmail: "E-mail", lblPhone: "Téléphone", lblPass: "Mot de passe (min 6)", btnSignup: "Créer un compte", hasAccount: "Déjà un compte ?", logIn: "Se connecter", demoNote: "Démo : les données sont enregistrées uniquement dans ce navigateur.", errFill: "Remplissez tous les champs", errEmail: "Entrez un e-mail valide", errPass: "Mot de passe min 6 caractères", errExists: "E-mail déjà enregistré", errSave: "Impossible d'enregistrer", okSignup: "Compte créé !" },
  de: { pageTitle: "Registrieren | GlobalWork", heading: "Registrieren", subheading: "Erstelle dein Konto", lblName: "Vollständiger Name", lblEmail: "E-Mail", lblPhone: "Telefon", lblPass: "Passwort (min. 6)", btnSignup: "Konto erstellen", hasAccount: "Bereits ein Konto?", logIn: "Anmelden", demoNote: "Demo: Daten werden nur in diesem Browser gespeichert.", errFill: "Alle Felder ausfüllen", errEmail: "Gültige E-Mail eingeben", errPass: "Passwort min. 6 Zeichen", errExists: "E-Mail bereits registriert", errSave: "Speichern fehlgeschlagen", okSignup: "Konto erstellt!" },
  pt: { pageTitle: "Cadastrar-se | GlobalWork", heading: "Cadastrar-se", subheading: "Crie sua conta", lblName: "Nome completo", lblEmail: "E-mail", lblPhone: "Telefone", lblPass: "Senha (mín 6)", btnSignup: "Criar conta", hasAccount: "Já tem conta?", logIn: "Entrar", demoNote: "Demo: os dados são salvos apenas neste navegador.", errFill: "Preencha todos os campos", errEmail: "Digite um e-mail válido", errPass: "Senha mín 6 caracteres", errExists: "E-mail já cadastrado", errSave: "Não foi possível salvar", okSignup: "Conta criada!" },
  hi: { pageTitle: "साइन अप | GlobalWork", heading: "साइन अप", subheading: "अपना खाता बनाएं", lblName: "पूरा नाम", lblEmail: "ईमेल", lblPhone: "फ़ोन", lblPass: "पासवर्ड (कम से कम 6)", btnSignup: "खाता बनाएं", hasAccount: "पहले से खाता है?", logIn: "लॉग इन करें", demoNote: "डेमो: डेटा केवल इस ब्राउज़र में सहेजा जाता है।", errFill: "सभी फ़ील्ड भरें", errEmail: "मान्य ईमेल दर्ज करें", errPass: "पासवर्ड कम से कम 6 अक्षर", errExists: "ईमेल पहले से पंजीकृत है", errSave: "सहेजा नहीं जा सका", okSignup: "खाता बन गया!" },
  ar: { pageTitle: "إنشاء حساب | GlobalWork", heading: "إنشاء حساب", subheading: "أنشئ حسابك", lblName: "الاسم الكامل", lblEmail: "البريد الإلكتروني", lblPhone: "الهاتف", lblPass: "كلمة المرور (6 على الأقل)", btnSignup: "إنشاء حساب", hasAccount: "لديك حساب بالفعل؟", logIn: "تسجيل الدخول", demoNote: "تجريبي: يتم حفظ البيانات فقط في هذا المتصفح.", errFill: "املأ جميع الحقول", errEmail: "أدخل بريدًا إلكترونيًا صحيحًا", errPass: "كلمة المرور 6 أحرف على الأقل", errExists: "البريد الإلكتروني مسجل بالفعل", errSave: "تعذر الحفظ", okSignup: "تم إنشاء الحساب!" },
  zh: { pageTitle: "注册 | GlobalWork", heading: "注册", subheading: "创建您的账户", lblName: "全名", lblEmail: "电子邮箱", lblPhone: "电话", lblPass: "密码（至少6位）", btnSignup: "创建账户", hasAccount: "已经有账户？", logIn: "登录", demoNote: "演示：数据仅保存在此浏览器中。", errFill: "请填写所有字段", errEmail: "请输入有效的电子邮箱", errPass: "密码至少6个字符", errExists: "邮箱已注册", errSave: "无法保存", okSignup: "账户已创建！" },
  ja: { pageTitle: "新規登録 | GlobalWork", heading: "新規登録", subheading: "アカウントを作成", lblName: "氏名", lblEmail: "メールアドレス", lblPhone: "電話番号", lblPass: "パスワード（6文字以上）", btnSignup: "アカウント作成", hasAccount: "すでにアカウントをお持ちですか？", logIn: "ログイン", demoNote: "デモ：データはこのブラウザにのみ保存されます。", errFill: "すべての項目を入力してください", errEmail: "有効なメールアドレスを入力してください", errPass: "パスワードは6文字以上", errExists: "メールアドレスは既に登録されています", errSave: "保存できませんでした", okSignup: "アカウントが作成されました！" }
};

var currentLang = 'en';
try { currentLang = localStorage.getItem('globalwork_lang') || 'en'; } catch(e){}
if (!T[currentLang]) currentLang = 'en';

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (T[currentLang][key]) {
      if (el.tagName === 'TITLE') {
        document.title = T[currentLang][key];
      } else {
        el.textContent = T[currentLang][key];
      }
    }
  });
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
}

var langSel = document.getElementById('langSel');
langSel.value = currentLang;
applyI18n();

langSel.addEventListener('change', function(e) {
  currentLang = e.target.value;
  try { localStorage.setItem('globalwork_lang', currentLang); } catch(e){}
  applyI18n();
});

// ====== Authentication Logic ======
function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  var h=5381,s=salt+pw;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve('d'+h);
}
function getUsers(){try{return JSON.parse(localStorage.getItem('globalwork_users')||'{}')}catch(e){return{}}}
function putUsers(u){try{localStorage.setItem('globalwork_users',JSON.stringify(u));return true}catch(e){return false}}
function show(el,cls,t){el.className='msg '+cls;el.textContent=t}

document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var m=document.getElementById('m');
  var n=document.getElementById('n').value.trim();
  var e=document.getElementById('e').value.trim().toLowerCase();
  var p=document.getElementById('p').value.trim();
  var w=document.getElementById('w').value;
  var t = T[currentLang];

  if(!n||!e||!p||!w){ show(m,'err',t.errFill); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ show(m,'err',t.errEmail); return; }
  if(w.length<6){ show(m,'err',t.errPass); return; }
  
  var u=getUsers();
  if(u[e]){ show(m,'err',t.errExists); return; }
  
  var salt=Math.random().toString(36).slice(2);
  hashPw(w,salt).then(function(h){
    u[e]={fullName:n,phone:p,salt:salt,hash:h,createdAt:new Date().toISOString()};
    if(!putUsers(u)){ show(m,'err',t.errSave); return; }
    try{localStorage.setItem('globalwork_session',e)}catch(x){}
    show(m,'ok',t.okSignup);
    setTimeout(function(){location.href='index.html'},900);
  });
});
</script>
</body>
</html>
